function recsFor(T) {
  const dd = diagData(), list = offered(state.dept, 1), base = new Set((CURRICULUM.byDept[state.dept] || []).map(c => c.n));
  const lib = []; T.gaps.filter(g => g.gap > 0).slice(0, 5).forEach(g => courseRecs(list.filter(c => !base.has(c.n)), g.sn).slice(0, 2).forEach(c => { if (!lib.some(x => x.c.n === c.n)) lib.push({ c, sn: g.sn, gap: g.gap }); }));
  const need = Object.fromEntries(T.gaps.map(g => [g.sn, g.gap / 100]));
  const micIds = [...new Set([...(T.job ? T.job.micro : []), ...microRecs(state.dept, Object.keys(need).length ? need : dd.need).map(r => r.m.id)])];
  const mics = micIds.map(id => CURRICULUM.micro.find(m => m.id === id)).filter(m => m && eligible(m, state.dept)).map(m => ({ m, hit: m.subs.filter(s => need[s] > 0) })).slice(0, 4);
  const ncs = ncRecs(dd).map(p => ({ ...p, hit: p.subs.filter(s => need[s] > 0) })).sort((a, b) => b.hit.length - a.hit.length || b.score - a.score).slice(0, 5);

  $view.querySelectorAll('input[name=rmic]').forEach(r => r.onchange = () => { S.mic = r.value; renderRecs(); });
  document.getElementById('rbuild').onclick = () => {
    state.plan = buildPlanFrom(T, R, S); savePlan();
    state.dmsg = { text: `${T.label} 기준으로 추천 교양 ${S.lib.size}과목${S.mic ? ', 융합과정 1개' : ''}를 넣어 계획을 만들고 저장했습니다.${S.nc.size ? ` 비교과 ${S.nc.size}개는 관심 등록했습니다.` : ''}` };

function buildPlanFrom(T, R, S) {
  const dept = state.dept, terms = planTerms(dept), items = [];
  (CURRICULUM.byDept[dept] || []).forEach(c => {
    if (items.some(i => i.n === c.n)) return;
    const t = c.t.find(x => x.term === '1학기' || x.term === '2학기') || c.t[0], term = t ? `${t.yr}-${t.term === '2학기' ? 2 : 1}` : terms[0];
    items.push({ n: c.n, cr: t ? t.credit : 2, subs: c.subs, cat: c.c, kind: 'base', term: terms.includes(term) ? term : terms[0] });
  });
  R.lib.filter(x => S.lib.has(x.c.n)).forEach(x => { const cr = x.c.t[0] ? x.c.t[0].credit : 2, term = firstFree(items, terms, cr) || terms[terms.length - 1]; items.push({ n: x.c.n, cr, subs: x.c.subs, cat: x.c.c, kind: 'rec', why: x.sn, term }); });
  const plan = { dept, items, micro: null, job: T.job ? T.job.id : null, design: { mode: T.mode, at: new Date().toISOString().slice(0, 10) } };
  if (S.mic) setMicro(plan, S.mic);

}
/* ④ 이수 계획 ↔ 이번 학기 시간표 전환 */
function planModeHtml(cur) {

/* ---------- 융합과정 현황: 수강 대상 과정 전체의 나노·마이크로디그리 진도 ---------- */
function courseStatus(name, plan) {
  const it = plan.items.find(i => i.n === name), done = (plan.done || {})[name];
  if (done) return { s: 'done', t: '이수 완료' };
  if (!it) return { s: 'none', t: '미계획' };
  const ti = planTerms(state.dept).indexOf(it.term), ci = planTerms(state.dept).indexOf(curTerm());
  if (ti < ci || (ti === ci && state.phase === 'end')) return { s: 'done', t: '이수 완료', term: it.term };
  if (ti === ci) return { s: 'now', t: '수강 중', term: it.term };
  return { s: 'plan', t: `${termName(it.term)} 계획`, term: it.term };
}
function microProgress(m, plan) {
  const rows = m.courses.map(c => ({ c, st: courseStatus(c.n, plan) }));
  const sum = s => rows.filter(r => s.includes(r.st.s)).reduce((a, r) => a + (r.c.cr || 0), 0);
  const done = sum(['done']), now = sum(['now']), planned = sum(['plan']);
  const tiers = m.crKnown ? m.tiers : [];
  const goal = tiers.find(t => done + now + planned < t[0]) || tiers[tiers.length - 1];
  return { m, rows, done, now, planned, tiers, goal, total: m.courses.reduce((a, c) => a + (c.cr || 0), 0), score: (done * 3 + now * 2 + planned) / Math.max(1, (tiers[0] || [8])[0]) };
}

      <div class="stats"><div class="stat"><b>${list.length}개</b><span>수강 대상 과정</span></div><div class="stat"><b>${mine ? esc(CURRICULUM.micro.find(m => m.id === mine).name) : '없음'}</b><span>목표 과정</span></div><div class="stat"><b>${list.reduce((a, x) => a + x.done, 0)}학점</b><span>융합과정 이수 학점</span></div></div>

    <section class="mgrid">${list.map(card).join('')}</section>

  const P = designPlan();
  $view.querySelectorAll('[data-mdone]').forEach(c => c.onchange = () => { P.done = { ...(P.done || {}) }; if (c.checked) P.done[c.dataset.mdone] = true; else delete P.done[c.dataset.mdone]; savePlan(); renderRoadmap(); });

/* ---------- ④ 이수 로드맵: 학년·학기별 계획을 단계(과정)로 보여 줌. 편집은 '계획 고치기' ---------- */
const LAYERS = [['base', '학과 편성 교양'], ['rec', '추천 교양'], ['micro', '융합과정']];
function renderPlanMap() {

  const layerOf = i => (i.kind === 'added' ? 'rec' : i.kind);
  const mp = plan.micro ? CURRICULUM.micro.find(m => m.id === plan.micro) : null, tiers = mp && mp.crKnown ? mp.tiers : [];
  let mcum = 0, reached = 0;
  const nodes = terms.map((t, k) => {
    const its = plan.items.filter(i => i.term === t), lib = its.filter(i => ['base', 'rec', 'added'].includes(i.kind)).reduce((a, i) => a + (i.cr || 0), 0);
    mcum += its.filter(i => i.kind === 'micro').reduce((a, i) => a + (i.cr || 0), 0);
    const marks = [];
    while (reached < tiers.length && mcum >= tiers[reached][0]) { marks.push(`<li class="ms-star">${esc(tiers[reached][1])} 달성 예상</li>`); reached++; }
    if (lib > CAP) marks.push(`<li class="ms-warn">교양 ${lib}학점 · 권장 ${CAP}학점 초과</li>`);
    marks.push(`<li class="ms-diag">${k === 0 ? '학기말 재진단(1차)' : `학기말 재진단(${k + 1}차)`}</li>`);

    return `<li class="pnode ${state_}" style="--k:${k}">
      <div class="pn-dot" aria-hidden="true"></div>
      <div class="pn-card"><header><b>${termName(t)}</b>${state_ === 'now' ? '<span class="pn-now">이번 학기</span>' : state_ === 'past' ? '<span class="meta">이수</span>' : ''}</header>
        <p class="pn-cr"><b>${lib}</b>학점 교양<span class="pn-bar"><i style="width:${Math.min(100, lib / CAP * 100)}%" class="${lib > CAP ? 'over' : ''}"></i></span></p>
        ${LAYERS.map(([ly, name]) => { const xs = its.filter(i => layerOf(i) === ly); return xs.length ? `<div class="pn-layer ly-${ly}"><span class="pn-ln">${name}</span><ul>${xs.map(i => `<li>${esc(i.n)}${i.cr ? ` <span class="meta">${i.cr}</span>` : ''}</li>`).join('')}</ul></div>` : ''; }).join('') || '<p class="meta">이 학기에 계획한 과목이 없습니다.</p>'}
        <ul class="pn-ms">${marks.join('')}</ul>
        ${state_ === 'now' ? '<button class="btn sm" data-go="timetable">이번 학기 시간표로 확정</button>' : ''}
      </div></li>`;
  }).join('');
  const libTot = plan.items.filter(i => ['base', 'rec', 'added'].includes(i.kind)).reduce((a, i) => a + (i.cr || 0), 0);
  const ncN = ncWish(plan).length, ncA = ncAlerts(plan).filter(x => x.seen !== 'applied').length, miss = gradCheck(plan).filter(r => !r.ok && !r.opt);
  const T = designTarget();
  $view.innerHTML = `${planModeHtml('planmap')}
  <div class="dash-grid">

      <p class="summary">${terms.length}개 학기에 걸쳐 교양 ${libTot}학점${mp ? `, ${esc(mp.name)}` : ''}를 이수합니다.${ncN ? ` 비교과 ${ncN}개는 관심 등록해 두었습니다.` : ''}</p>
      <div class="stats"><div class="stat"><b>${libTot}학점</b><span>교양(학과 편성·추천)</span></div><div class="stat"><b>${mp ? (tiers.length ? (reached ? esc(tiers[reached - 1][1]) : '진행 중') : '학점 미정') : '선택 안 함'}</b><span>융합과정(선택)</span></div><div class="stat"><b>${ncN}개${ncA ? ` · 개설 ${ncA}` : ''}</b><span>비교과 관심 등록 · 개설 알림</span></div><div class="stat"><b>${miss.length ? `${miss.length}개 부족` : '충족'}</b><span>졸업 요건(교양)</span></div></div>

  if (last && last.verdict === '재실시') alerts.push(['재실시 필요', '응답 신뢰성 점검에서 재실시 판정을 받았습니다. 진단을 다시 받아 주세요.', 'intro']);
  if (state.phase === 'end' && !H.some(h => h.end) && H.length) alerts.push(['재진단 기간', '학기말 재진단 기간입니다. 같은 3종 진단을 다시 받아 성장을 확인하세요.', 'intro']);
  if (state.phase === 'start' && H.length && !plan) alerts.push(['이수 계획', '진단 결과로 이번 학기 이수 계획을 세워 저장하세요.', 'plan']);
  if (H.length >= 2) { const d = mean(H[H.length - 1].vals) - mean(H[0].vals); if (d < ((state.alertStd && state.alertStd.drop) || 0)) alerts.push(['지도교수 상담', `직업기초역량 향상도가 ${d.toFixed(1)}점으로 기준에 못 미쳐 지도교수 상담이 안내됩니다.`, 'growth']); }
  const termCr = plan ? plan.items.filter(i => i.term === planTerms(state.dept)[0]).reduce((a, i) => a + (i.cr || 0), 0) : 0;
  $view.innerHTML = `
  <div class="dash-grid">
    <section class="panel p-sum has-terra">
      ${last ? terraHtml({ frames: H.length > 1 ? [H[0].vals, last.vals] : [last.vals], labels: H.length > 1 ? [H[0].label, last.label] : [last.label], avg: true, cap: `직업기초 7영역 · ${last.label} ${last.date}. 깜박이는 점이 가장 먼저 보완할 영역입니다.` }) : terraHtml({ frames: [AREAS.map(() => 0)], empty: true, avg: true, cap: '진단을 마치면 학교 평균(회색 점선) 위에 내 점수가 그려집니다.' })}
      <p class="eyebrow">${PHASES.find(x => x[0] === state.phase)[1]}</p>
      <p class="summary">${esc(u.name)}님, ${next ? `다음 할 일은 <b>${next.k}</b>입니다.` : '이번 학기 과정을 모두 마쳤습니다.'}</p>
      ${next ? `<div class="actions"><button class="btn" data-go="${next.go}">${next.k} ${next.done ? '보기' : '하러 가기'}</button></div>` : ''}
      <ol class="stepper">${steps.map((s, i) => `<li class="${s.done ? 'done' : s === next ? 'now' : s.locked ? 'lock' : ''}"><button data-go="${s.go}" ${s.locked ? 'disabled' : ''}><span class="sn">${s.done ? '✓' : i + 1}</span><b>${s.k}</b><span class="meta">${s.locked ? '학기말에 열림' : s.d}</span></button></li>`).join('')}</ol>
    </section>
    ${panelH('p-hme', '나의 역량', last ? `${last.label} · ${last.date}` : '', last ? `<div class="stats stats-sm"><div class="stat"><b>${Math.round(mean(last.vals))}</b><span>직업기초 평균</span></div><div class="stat"><b>${CORE_AXES[last.core.indexOf(Math.min(...last.core))]}</b><span>핵심역량 보완 축</span></div><div class="stat"><b>${BASIC_SUBJ.filter((_, k) => last.basic[k] < MID).join('·') || '없음'}</b><span>기초학습 낮음</span></div></div>
      ${AREAS.map((a, k) => `<div class="sub"><span>${a.short}</span><div class="bar ${last.vals[k] < MID ? 'low' : ''}"><b style="width:${last.vals[k]}%"></b></div><span class="lv">${last.vals[k]}</span></div>`).join('')}
      <div class="actions"><button class="btn ghost sm" data-go="result">결과 자세히</button><button class="btn ghost sm" data-go="analysis">AI 분석</button></div>` : '<p class="meta">아직 진단 기록이 없습니다.</p><div class="actions"><button class="btn sm" data-go="intro">진단 시작</button></div>')}
    ${panelH('p-hal', '지금 할 일', `${studentTodos().length}건 · 누르면 해당 화면으로`, todoHtml(studentTodos(), '지금 처리할 일이 없습니다. 이번 학기 계획대로 진행하세요.'))}
    ${panelH('p-hpl', '나의 이수 계획', plan ? '저장됨' : '아직 없음', plan ? `<p>${plan.items.length}과목${plan.micro ? ` · 목표 융합과정 <b>${CURRICULUM.micro.find(m => m.id === plan.micro).name}</b>` : ''}</p><p class="meta">${termName(planTerms(state.dept)[0])} 교양 ${termCr}학점 계획</p><div class="actions"><button class="btn ghost sm" data-go="planmap">계획 보기</button><button class="btn ghost sm" data-go="timetable">내 시간표에 맞추기</button><button class="btn ghost sm" data-go="career">설계 다시 하기</button></div>` : '<p class="meta">목표 직무를 정하면 차이 분석과 추천을 거쳐 학기별 계획을 세웁니다.</p><div class="actions"><button class="btn ghost sm" data-go="career">설계 시작하기</button></div>')}
    ${panelH('p-hck', '이번 주 자기주도 학습', '최근 4주 실천', checkinHtml())}
    ${panelH('p-hgr', '진단 기록', `${H.length}회`, H.length ? `<table class="tbl"><thead><tr><th>회차</th><th>날짜</th><th>직업기초</th><th>신뢰성</th></tr></thead><tbody>${H.map(h => `<tr><td>${h.label}</td><td>${h.date}</td><td>${Math.round(mean(h.vals))}</td><td>${h.verdict}</td></tr>`).join('')}</tbody></table>` : '<p class="meta">기록이 없습니다.</p>')}
  </div>`;
}

/* ---------- 교원 홈 ---------- */
function renderFHome() {
  const al = advisorAlerts(), log = sGet('org', 'counsel') || {};
  const doneN = al.filter(a => log[a.st.no]).length;
  const courses = offered(state.dept, 1).filter(c => c.src === '소속 학과 교과과정').slice(0, 6);
  $view.innerHTML = `
  <div class="dash-grid">
    <section class="panel p-sum"><p class="eyebrow">${PHASES.find(x => x[0] === state.phase)[1]}</p>
      <p class="summary">${esc(state.user.name)}님, 지도 학생 상담 알림 ${al.length}건 중 ${al.length - doneN}건이 남아 있습니다.</p>
      <div class="stats"><div class="stat"><b>${al.length}명</b><span>상담 알림(${esc(state.dept)})</span></div><div class="stat"><b>${doneN}명</b><span>상담 완료</span></div><div class="stat"><b>${courses.length}개</b><span>수준별 분반 대상 교양</span></div></div>
      <div class="actions"><button class="btn" data-go="advisor">지도 학생 상담</button><button class="btn ghost" data-go="sections">수준별 분반</button></div></section>
    ${panelH('p-fa', '상담 알림 미리 보기', `${al.length - doneN}건 남음`, al.length ? `<ul class="alerts">${al.slice(0, 5).map(a => `<li><b>${a.st.alias}</b><span>${a.why.join(' · ')}</span>${log[a.st.no] ? '<span class="okc">완료</span>' : ''}</li>`).join('')}</ul><div class="actions"><button class="btn ghost sm" data-go="advisor">전체 보기</button></div>` : '<p class="meta">알림이 없습니다.</p>')}
    ${panelH('p-fw', '지금 할 일', '', todoHtml(facultyTodos(al, log)))}
    ${panelH('p-freal', '플랫폼 이용 학생', '서버에 저장된 실제 이용 기록', '<div id="realbox"><p class="meta">불러오는 중…</p></div>')}
  </div>`;
  fillRealStudents('realbox');
}

/* ---------- 관리자 홈: 운영 프로세스 현황 ---------- */
function renderAHome() {
  const co = cohort(), n = co.length, p = state.phase;
  const re = co.filter(st => st.rel === '재실시').length, ca = co.filter(st => st.rel === '주의').length;
  const planned = co.filter(st => st.picks.length).length;
  const E = p === 'end' ? effectiveness() : null, G = p === 'end' ? gainStats('ncs', 3, (state.alertStd && state.alertStd.drop) || 0) : null;
  const allAlerts = p === 'mid' || p === 'end' ? co.filter(st => st.relCount >= 2 || (st.basicLow && !st.suppDone)).length + (G ? G.below : 0) : 0;
  const box = (no, t, who, val, sub, go, state_) => `<li class="pstep ${state_}"><span class="sn">${no}</span><div><b>${t}</b><span class="meta">${who}</span><p class="pv">${val}</p><p class="meta">${sub}</p>${go ? `<button class="linkbtn" data-go="${go}">열기</button>` : ''}</div></li>`;
  const st = (on, done) => (done ? 'done' : on ? 'now' : 'wait');
  $view.innerHTML = `
  <div class="dash-grid">
    <section class="panel p-sum has-terra"><p class="eyebrow">${PHASES.find(x => x[0] === p)[1]} · 2026학년도 1학기</p>
      <p class="summary">신입생 ${n}명의 대학 생활 설계 운영 현황입니다.</p>
      ${terraHtml({ frames: p === 'end' ? [AREAS.map((_, k) => mean(co.map(s => s.traceArea[0][k]))), AREAS.map((_, k) => mean(co.map(s => s.traceArea[1][k])))] : [AREAS.map((_, k) => mean(co.map(s => s.traceArea[0][k])))], labels: ['입학 직후', '1학기말'], cap: p === 'end' ? '신입생 평균 점수: 입학 직후(점선)에서 1학기말(실선)로 바뀐 모습' : '신입생 평균 점수(입학 직후). 깜박이는 점이 평균이 가장 낮은 영역입니다.' })}
      <p class="meta"><span class="badge amber">가상 예시 데이터</span> 오른쪽 위 '시연 시점'을 바꾸면 학기 진행에 따라 단계별 현황이 바뀝니다.</p></section>
    ${panelH('p-todo', '지금 할 일', `${PHASES.find(x => x[0] === p)[1]} · ${adminTodos().length}건`, todoHtml(adminTodos()))}
    <section class="panel p-proc"><header class="phead"><h2>운영 프로세스</h2><span class="meta">시스템설계서 3장 순서</span></header><div class="pbody"><ol class="proc">
      ${box(1, '3종 진단', '학생', `${n}명 응시`, '직업기초·핵심·기초학습', 'diagops', st(p === 'start', p !== 'start'))}
      ${box(2, '신뢰성 점검', '플랫폼', `재실시 ${re}명 · 주의 ${ca}명`, `재실시율 ${(re / n * 100).toFixed(1)}%`, 'diagops', st(p === 'start', p !== 'start'))}
      ${box(3, 'AI 분석·추천·계획', '플랫폼·학생', `${planned}명 계획 수립`, '교양·융합·비교과 추천', null, st(p === 'start', p !== 'start'))}
      ${box(4, '수준별 자동 분반', '교원', '교양 분반 편성', '진단 점수로 상·중·하 분반', null, st(p === 'start', p !== 'start'))}
      ${box(5, '학점 연계', '관리자', state.gradeApplied ? `${state.gradeApplied.rows}행 반영` : p === 'start' ? '학기말 예정' : '반영 대기', '학사정보시스템 연동 또는 업로드', 'grades', st(p !== 'start', !!state.gradeApplied))}
      ${box(6, '학기말 재진단', '학생', p === 'end' ? `${n - re}명 응시` : '학기말 예정', '같은 3종 진단', null, st(p === 'end', false))}
      ${box(7, '향상도·효과성 분석', '플랫폼', G ? `평균 ${sgn(G.m)}점 · 기준 미만 ${G.below}명` : '학기말 예정', E ? `개선·재설계 검토 ${E.rows.filter(r => /개선|재설계/.test(r.decision)).length}개` : '재진단 후 자동 분석', p === 'end' ? 'gain' : null, st(p === 'end', false))}
      ${box(8, '상담 알림·교육과정 개선', '교원·위원회', p === 'start' ? '-' : `상담 알림 ${allAlerts}명`, p === 'end' ? '위원회 안건 자동 작성' : '재실시 반복·기초학습 낮음', p === 'end' ? 'committee' : null, st(p !== 'start', false))}
    </ol></div></section>
  </div>`;
}
const NEXT = {
  result: [['analysis', 'AI 분석 보기'], ['career', '내 설계 시작하기']],
  analysis: [['career', '내 설계 시작하기']],
  career: [['gap', '② 차이 분석으로']],
  gap: [['recs', '③ 추천 교육과정 보기'], ['career', '목표 다시 정하기']],
  planmap: [['timetable', '이번 학기 시간표로 확정'], ['roadmap', '융합과정 현황']],
  plan: [['planmap', '이수 로드맵 보기'], ['timetable', '이번 학기 시간표로 확정']],
  timetable: [['planmap', '이수 로드맵'], ['counsel', '상담하기']],
  roadmap: [['planmap', '이수 로드맵']],
  growth: [['plan', '다음 학기 계획 세우기'], ['counsel', '상담하기']],
  sections: [['advisor', '지도 학생 상담']],
  advisor: [['fhome', '홈에서 할 일 보기']],
  diagops: [['notify', '진단 안내 메일 보내기'], ['itembank', '문항 관리']],
  itembank: [['forms', 'B형 검사지 구성']],
  itemqa: [['itembank', 'AI로 문항 고치기']],
  forms: [['diagops', '진단 운영으로']],
  integration: [['majortt', '전공 시간표 관리'], ['ahome', '지금 할 일로']],
  majortt: [['electt', '교양·융합 시간표'], ['ahome', '지금 할 일로']],
  electt: [['integration', '수강편람 연동'], ['ahome', '지금 할 일로']],
  grades: [['gain', '성과 분석']],
  ncopen: [['notify', '메일 알림 발송'], ['grades', '학점 연계']],
  notify: [['auditlog', '발송 기록 확인']],
  gain: [['impact', '교육과정 효과성 보기']],
  impact: [['committee', '위원회 안건 만들기']],
  specmap: [['coverage', '교과과정 점검']],
  coverage: [['studio', '개선안 설계']],
  studio: [['committee', '위원회 안건']],
  committee: [['report', '보고서 만들기']]
};
function nextBar() {
  const nx = NEXT[state.step];
  if (!nx || !state.user || roleOf(state.step) !== state.user.role) return;
  $view.insertAdjacentHTML('beforeend', `<nav class="nextbar no-print" aria-label="다음 단계"><span class="meta">다음 단계</span>${nx.map(([g, t], i) => `<button class="btn ${i ? 'ghost' : ''}" data-go="${g}">${t}</button>`).join('')}</nav>`);
}

function demoFill() {
  fillDemo();
  state.step = 'result';
  render();
}

function render() {
  const u = state.user;
  if (!u) state.step = 'login';
  else if (state.step === 'login' || !groupOf(state.step) && !['quiz', 'retake', 'needdiag'].includes(state.step)) state.step = HOME[u.role];
  document.body.classList.toggle('wide', !u || !['intro', 'quiz'].includes(state.step));
  document.body.classList.toggle('authpage', !u);
  document.body.classList.toggle('no-demo', !demoOn());
  document.body.classList.toggle('dash', ['home', 'fhome', 'ahome', 'result', 'analysis', 'plan', 'planmap', 'timetable', 'gap', 'recs', 'roadmap', 'studio', 'counsel', 'career', 'sections', 'advisor', 'diagops', 'grades', 'gain', 'impact', 'itembank', 'forms', 'settings', 'integration', 'majortt', 'electt', 'ncopen', 'notify', 'auditlog', 'axkpi', 'specmap', 'report', 'ask', 'itemqa'].includes(state.step));
  renderNav();
  const R = { login: renderLogin, home: renderHome, fhome: renderFHome, ahome: renderAHome, needdiag: renderNeedDiag, intro: renderIntro, quiz: renderQuiz, coverage: renderCoverage, roadmap: renderRoadmap,
    committee: renderCommittee, growth: renderGrowth, impact: renderImpact, plan: renderPlan, studio: renderStudio, counsel: renderCounsel, career: renderCareer, sections: renderSections,
    advisor: renderAdvisor, diagops: renderDiagOps, grades: renderGrades, analysis: renderAnalysis, timetable: renderTimetable, gap: renderGap, recs: renderRecs, planmap: renderPlanMap, gain: renderGain, itembank: renderItemBank, forms: renderForms, settings: renderSettings, integration: renderIntegration, majortt: renderMajorTT, electt: renderElectTT, ncopen: renderNcOpen, notify: renderNotify, auditlog: renderAudit, axkpi: renderAxKpi, specmap: renderSpecMap, report: renderReport, ask: renderAsk, itemqa: renderItemQA, result: renderResult };
  const ph = document.getElementById('pagehead'); if (ph) ph.innerHTML = u ? crumbHtml() + viewSwitchHtml() : '';
  (R[state.step] || renderResult)();
  if (state.step === 'home') bindCheckin();
  nextBar();
  mountTerra($view);
}
authInit().then(render);
</script>
