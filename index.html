<!doctype html>
<html lang="ko">
<head>
<!-- 대학 생활 설계 플랫폼(가칭) 시제품 · 단일 파일판. AI 상담은 서버 연결 시에만 동작하고, 이 파일에서는 규칙 기반 답변을 씁니다. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대학 생활 설계 플랫폼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* 북유럽 팔레트: 서리(바탕) · 종이(면) · 화강암(글자) · 피오르(주색) · 오크(보완) · 이끼(양호) · 링곤(위험) */
  --paper: #F2F4F3;
  --panel: #FFFFFF;
  --ink: #1C2826;
  --muted: #5F6E6A;
  --line: #DFE5E2;
  --line-strong: #BCC7C3;
  --signal: #2D5F6F;
  --signal-deep: #224A57;
  --signal-soft: #E3EDEF;
  --amber: #C38D2C;
  --amber-soft: #F6EDDC;
  --warn-ink: #7E5512;
  --ok: #4E7D5B; --ok-ink: #2E5D3D; --ok-soft: #E4EEE6;
  --bad-ink: #973A3F; --bad-soft: #F5E3E3;
  --track: #E8EDEB;
  --radius: 14px; --radius-sm: 8px;
  --font: "Wanted Sans Variable", "Wanted Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #131918;
    --panel: #1A2120;
    --ink: #E5ECE9;
    --muted: #9AA9A4;
    --line: #2A3432;
    --line-strong: #3E4B48;
    --signal: #8DBBCB;
    --signal-deep: #A9CEDB;
    --signal-soft: #1E3138;
    --amber: #D6A750;
    --amber-soft: #352B17;
    --warn-ink: #E2BC72;
    --ok: #7FB28E; --ok-ink: #93C9A2; --ok-soft: #1D2E23;
    --bad-ink: #E59EA2; --bad-soft: #3A2224;
    --track: #252E2C;
  }
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0; font-family: var(--font); color: var(--ink); background: var(--paper);
  font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased;
  word-break: keep-all; overflow-wrap: anywhere;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; border-radius: 4px; }

.shell { max-width: 1080px; margin: 0 auto; padding: 28px 20px 72px; }
.topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 36px; }
.brand { font-weight: 700; letter-spacing: -0.01em; }
.tag { color: var(--muted); font-size: 14px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 56px; align-items: start; }
.dial-wrap { position: sticky; top: 24px; }
.dial-note { color: var(--muted); font-size: 14px; margin: 6px 0 0; }

h1 { font-size: clamp(34px, 5.2vw, 56px); line-height: 1.14; letter-spacing: -0.035em; margin: 0 0 20px; font-weight: 700; }
h2 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 12px; font-weight: 700; }
p { margin: 0 0 14px; }
.lede { font-size: 18px; max-width: 34em; }
.facts { list-style: none; padding: 0; margin: 28px 0; max-width: 34em; }
.facts li { padding: 10px 0; border-top: 1px solid var(--line); }
.facts li:last-child { border-bottom: 1px solid var(--line); }
.facts b { font-weight: 700; }

.btn { display: inline-block; border: 0; border-radius: 6px; padding: 13px 22px; font-weight: 700; cursor: pointer; background: var(--ink); color: var(--paper); }
.btn:hover { background: var(--signal); color: #fff; }
.btn[disabled] { opacity: .35; cursor: not-allowed; background: var(--ink); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.btn.ghost:hover { background: var(--ink); color: var(--paper); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.linkbtn:hover { color: var(--signal); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 8px; }

/* stepper */
.stepper { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
.stepper i { display: block; height: 5px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.stepper i::after { content: ""; position: absolute; inset: 0; background: var(--signal); transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform .25s; }
.where { color: var(--muted); font-size: 15px; margin-bottom: 26px; display: flex; justify-content: space-between; gap: 12px; }
.qtext { font-size: clamp(20px, 2.6vw, 25px); line-height: 1.5; letter-spacing: -0.015em; margin: 0 0 26px; font-weight: 500; max-width: 30em; }

.opts { list-style: none; margin: 0 0 28px; padding: 0; display: grid; gap: 10px; max-width: 36em; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt label { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer; }
.opt label .mk { font-weight: 700; color: var(--muted); }
.opt input:checked + label { border-color: var(--signal); background: var(--signal-soft); }
.opt input:checked + label .mk { color: var(--signal); }
.opt input:focus-visible + label { outline: 3px solid var(--signal); outline-offset: 3px; }
.opt:hover label { border-color: var(--signal); }

.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 36em; margin-bottom: 8px; }
.scale .opt label { display: block; text-align: center; padding: 16px 0; font-weight: 700; font-size: 20px; }
.scale-ends { display: flex; justify-content: space-between; max-width: 36em; color: var(--muted); font-size: 14px; margin-bottom: 28px; }

/* result */
.summary { font-size: clamp(24px, 3.4vw, 34px); line-height: 1.35; letter-spacing: -0.025em; font-weight: 700; margin: 0 0 8px; max-width: 22em; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin: 0 0 6px; }
.legend span::before { content: ""; display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--signal); vertical-align: middle; margin-right: 6px; }
.legend span.avg::before { border-top: 2px dashed var(--muted); }
section.block { margin-top: 44px; }
.area-row { padding: 18px 0; border-top: 1px solid var(--line); }
.area-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.area-name { font-weight: 700; font-size: 18px; letter-spacing: -0.015em; }
.area-score { font-variant-numeric: tabular-nums; font-weight: 700; }
.sub { display: grid; grid-template-columns: 9.5em 1fr 4.5em; gap: 12px; align-items: center; padding: 4px 0; font-size: 15px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--signal); }
.bar.low b { background: var(--amber); }
.lv { font-size: 14px; color: var(--muted); text-align: right; }
.lv.low { color: var(--warn-ink); font-weight: 700; }
@media (prefers-color-scheme: dark) { .lv.low { color: var(--amber); } }
.prose p { max-width: 36em; }
.tips { margin: 0; padding-left: 1.2em; max-width: 36em; }
.tips li { margin-bottom: 8px; }
.rec { max-width: 40em; }
.rec dt { font-weight: 700; margin-top: 18px; }
.rec dd { margin: 4px 0 0; color: var(--ink); }
.rec .why { color: var(--muted); font-size: 14px; }
.fine { color: var(--muted); font-size: 14px; max-width: 40em; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 48px; }

/* dial */
.dial text { font-family: var(--font); fill: var(--ink); }
.dial .ring { fill: none; stroke: var(--line); stroke-width: 1; }
.dial .spoke { stroke: var(--line); stroke-width: 1; }
.dial .lab { font-size: 13px; font-weight: 500; }
.dial .lab.done { font-weight: 700; fill: var(--signal); }
.dial .lab.now { font-weight: 700; }
.dial .tick { font-size: 10px; fill: var(--muted); }
.dial .me-poly { fill: var(--signal); fill-opacity: .16; stroke: var(--signal); stroke-width: 2.5; stroke-linejoin: round; }
.dial .me-spoke { stroke: var(--signal); stroke-width: 5; stroke-linecap: round; }
.dial .avg-poly { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.dial .dot { fill: var(--signal); }
.dial .dot.weak { fill: var(--amber); }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; gap: 24px; }
  .dial-wrap { position: static; order: -1; max-width: 340px; }
  .sub { grid-template-columns: 8em 1fr 4em; }
}
@media (prefers-reduced-motion: reduce) { .stepper i::after { transition: none; } }
@media print {
  .no-print, .topbar .tag { display: none !important; }
  html, body { background: #fff; }
  .layout { grid-template-columns: 1fr 300px; }
  .dial-wrap { position: static; }
}

.pick { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 24px; }
.pick label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.pick select { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 6px; padding: 10px 12px; min-width: 11em; }
.meta { color: var(--muted); font-size: 14px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 10px; background: var(--signal-soft); color: var(--signal); margin-left: 6px; vertical-align: 1px; }
.badge.amber { background: var(--amber-soft); color: var(--warn-ink); }
@media (prefers-color-scheme: dark) { .badge.amber { color: var(--amber); } }
.recsub { margin: 0 0 22px; max-width: 42em; }
.recsub h3 { font-size: 16px; margin: 0 0 6px; }
.recsub ul { margin: 0; padding-left: 1.2em; }
.recsub li { margin-bottom: 6px; }
.gap { color: var(--warn-ink); font-weight: 500; }
@media (prefers-color-scheme: dark) { .gap { color: var(--amber); } }
.micro { padding: 16px 0; border-top: 1px solid var(--line); max-width: 42em; }
.micro:last-child { border-bottom: 1px solid var(--line); }
.micro h3 { font-size: 17px; margin: 0 0 4px; }
.micro p { margin: 0 0 6px; font-size: 15px; }
.wide .layout { grid-template-columns: minmax(0, 1fr); }
.wide .dial-wrap { display: none; }
.cov { display: grid; grid-template-columns: 11em 1fr 9em; gap: 12px; align-items: center; padding: 5px 0; font-size: 15px; }
.cov .bar b { background: var(--signal); }
.cov .bar.low b { background: var(--amber); }
.cov-area { font-weight: 700; margin: 26px 0 4px; padding-top: 14px; border-top: 1px solid var(--line); }
@media (max-width: 860px) { .cov { grid-template-columns: 8em 1fr 7em; } }

.chk { display: block; font-size: 15px; margin: 2px 0; cursor: pointer; }
.chk input { margin-right: 8px; accent-color: var(--signal); }
.prog { font-weight: 700; color: var(--signal); margin-top: 8px; }

.road { list-style: none; counter-reset: st; margin: 28px 0 0; padding: 0; max-width: 40em; }
.road li { counter-increment: st; display: grid; grid-template-columns: 2.4em 1fr; column-gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.road li::before { content: counter(st); grid-row: span 2; font-size: 28px; font-weight: 700; color: var(--signal); line-height: 1.2; }
.road h3 { margin: 0 0 2px; font-size: 18px; }
.road p { margin: 0; color: var(--ink); }
.sub3 { font-size: 16px; margin: 18px 0 6px; }

.pbar { margin: 4px 0 10px; max-width: 24em; }
.sector { display: grid; grid-template-columns: 8em 1fr 3.2em; gap: 10px; align-items: center; font-size: 14px; padding: 2px 0; max-width: 28em; }
.outcome { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.plan { margin-top: 12px; border-top: 1.5px solid var(--ink); max-width: 46em; }
.plan-row { display: grid; grid-template-columns: 9.5em 1fr 8em; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.plan-term { display: grid; gap: 2px; }
.plan-term .meta { font-size: 12px; line-height: 1.4; }
.plan-items { list-style: none; margin: 0; padding: 0; }
.plan-items li { margin-bottom: 4px; }
.plan-load { display: grid; gap: 4px; }
.plan-load .lv { text-align: left; }
@media (max-width: 640px) { .plan-row { grid-template-columns: 1fr; gap: 6px; } }

.pick input { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 6px; padding: 10px 12px; min-width: 13em; }
.cert { position: relative; max-width: 860px; margin: 8px auto 0; padding: 40px 48px 28px; background: #fff; color: #1a1a1a; border: 2px solid #1a1a1a; outline: 1px solid #1a1a1a; outline-offset: -9px; overflow: hidden; word-break: keep-all; }
.cert header { text-align: center; margin-bottom: 22px; }
.cert-org { font-family: "Noto Serif KR", serif; font-size: 18px; letter-spacing: .08em; margin: 0 0 8px; }
.cert-title { font-family: "Noto Serif KR", serif; font-size: 34px; font-weight: 700; letter-spacing: .04em; margin: 0 0 6px; color: #1a1a1a; }
.cert-no { margin: 0; font-size: 13px; color: #444; }
.cert-id { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 18px; margin: 0 0 20px; padding: 12px 0; border-top: 1px solid #999; border-bottom: 1px solid #999; }
.cert-id div { display: grid; grid-template-columns: 3em 1fr; align-items: baseline; }
.cert-id dt { color: #555; font-size: 14px; }
.cert-id dd { margin: 0; font-weight: 700; }
.cert-ph { color: #999; font-weight: 400; }
.cert-body { font-family: "Noto Serif KR", serif; font-size: 17px; line-height: 1.9; margin: 0 0 18px; }
.cert-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 22px; }
.cert-table th, .cert-table td { border: 1px solid #999; padding: 6px 10px; text-align: left; }
.cert-table th:last-child, .cert-table td:last-child { text-align: right; width: 5em; }
.cert-table thead th { background: #efefef; }
.cert-table .sum td { font-weight: 700; background: #f7f7f7; }
.cert footer { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; }
.cert-verify { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center; font-size: 12.5px; color: #333; }
.cert-verify p { margin: 0 0 4px; }
.cert-qr { width: 92px; height: 92px; border: 1.5px dashed #888; display: grid; place-items: center; text-align: center; font-size: 11px; color: #777; line-height: 1.4; }
.cert-sign { text-align: center; position: relative; min-width: 14em; }
.cert-date { margin: 0 0 8px; font-size: 15px; }
.cert-pres { font-family: "Noto Serif KR", serif; font-size: 20px; font-weight: 700; margin: 0 0 6px; }
.cert-seal { width: 70px; height: 70px; margin: 0 auto; border: 1.5px dashed #888; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; color: #777; text-align: center; line-height: 1.3; padding: 8px; }
.cert-foot { margin: 20px 0 0; text-align: center; font-size: 12px; color: #777; }
.cert-wm { position: absolute; inset: 0; display: grid; place-items: center; font-size: 54px; font-weight: 700; color: rgba(190, 40, 40, .13); transform: rotate(-22deg); pointer-events: none; white-space: nowrap; }
@media (max-width: 640px) { .cert { padding: 28px 20px 20px; } .cert-id { grid-template-columns: 1fr; } .cert footer { grid-template-columns: 1fr; } .cert-wm { font-size: 30px; } .cert-title { font-size: 26px; } }
@media print { .topbar, .subnav, .nextbar { display: none !important; } }

.cmpwrap { margin-top: 10px; max-width: 46em; }
.cmp { display: grid; grid-template-columns: 5.5em 1fr 15em; gap: 12px; align-items: center; padding: 7px 0; font-size: 14px; border-top: 1px solid var(--line); }
.cmp-name { font-weight: 700; }
.cmp-track { position: relative; height: 22px; background: linear-gradient(var(--line), var(--line)) center / 100% 2px no-repeat; }
.cmp-track i { position: absolute; top: 50%; transform: translate(-50%, -50%); display: block; }
.cmp-track .band { height: 10px; background: var(--signal-soft); transform: translateY(-50%); border-radius: 5px; }
.cmp-track .avg { width: 2px; height: 18px; background: var(--muted); }
.cmp-track .dep { width: 10px; height: 10px; background: var(--amber); transform: translate(-50%, -50%) rotate(45deg); }
.cmp-track .me { width: 14px; height: 14px; border-radius: 50%; background: var(--signal); border: 2px solid var(--paper); }
.cmp-legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 6px 0; font-size: 13px; }
.cmp-legend .lg { display: inline-block; vertical-align: middle; margin-right: 5px; }
.lg.band { width: 18px; height: 8px; background: var(--signal-soft); border-radius: 4px; }
.lg.avg { width: 2px; height: 14px; background: var(--muted); }
.lg.dep { width: 9px; height: 9px; background: var(--amber); transform: rotate(45deg); }
.lg.me { width: 11px; height: 11px; border-radius: 50%; background: var(--signal); }
@media (max-width: 640px) { .cmp { grid-template-columns: 4.5em 1fr; } .cmp-txt { grid-column: 1 / -1; } }
.sector.wide-label { grid-template-columns: 16em 1fr 3.2em; max-width: 36em; }
@media (max-width: 640px) { .sector.wide-label { grid-template-columns: 1fr; } }
.tbl { border-collapse: collapse; width: 100%; max-width: 50em; font-size: 14px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 7px 10px 7px 0; text-align: left; vertical-align: top; }
.tbl thead th { border-bottom: 1.5px solid var(--ink); font-weight: 700; }
.tbl td.low { color: var(--warn-ink); font-weight: 700; }
@media (prefers-color-scheme: dark) { .tbl td.low { color: var(--amber); } }

.spark { display: block; }
.tbl td.ok { color: var(--ok-ink); font-weight: 700; }
@media (prefers-color-scheme: dark) { .tbl td.ok { color: var(--ok-ink); } }
.tbl td, .tbl th { white-space: nowrap; }
.tbl { display: block; overflow-x: auto; }

.dash .shell { max-width: 1280px; }
.dash-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.panel { container-type: inline-size; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--ink); border-radius: 2px; display: flex; flex-direction: column; min-width: 0; }
.phead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 12px 18px 10px; border-bottom: 1px solid var(--line); }
.phead h2 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
.pbody { padding: 14px 18px 18px; flex: 1; min-height: 0; }
.pbody.scroll { max-height: 520px; overflow: auto; }
.pbody > :first-child { margin-top: 0; }
.p-sum { grid-column: span 12; padding: 18px 22px 20px; border-top-color: var(--signal); }
.p-sum .summary { max-width: none; margin: 0 0 14px; font-size: clamp(22px, 2.6vw, 30px); }
.p-dial { grid-column: span 4; } .p-areas { grid-column: span 8; }
.p-cmp { grid-column: span 7; } .p-int { grid-column: span 5; }
.p-crs { grid-column: span 7; } .p-mic { grid-column: span 5; }
.p-sim { grid-column: span 12; }
.p-nav { grid-column: span 12; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.stat { padding: 10px 14px 4px 0; display: grid; gap: 0; }
.stat b { font-size: 24px; letter-spacing: -0.02em; line-height: 1.25; }
.stat span { color: var(--muted); font-size: 13px; }
.stats-sm { margin: 8px 0 6px; } .stats-sm .stat b { font-size: 20px; }
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 26px; }
.aitem { padding: 8px 0 10px; border-bottom: 1px solid var(--line); }
.aitem .sub { grid-template-columns: 7.6em 1fr 2.2em; font-size: 14px; }
.p-dial .dial { max-width: 340px; margin: 0 auto; display: block; }
.p-dial .legend { justify-content: center; margin-top: 4px; }
.tabs { display: flex; gap: 4px; margin: -4px 0 12px; border-bottom: 1px solid var(--line); position: sticky; top: -14px; background: var(--panel); z-index: 1; padding-top: 4px; }
.tab { font: inherit; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--signal); font-weight: 700; }
.tab:hover { color: var(--ink); }
.tabpanel[hidden] { display: none; }
.navgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.navbtn { text-align: left; font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 6px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.navbtn:hover { border-color: var(--signal); }

/* ======================================================================

   위계는 크기·굵기·간격으로, 색은 의미(주색·보완·양호·위험)에만 씁니다.

body { font-size: 16px; line-height: 1.7; letter-spacing: -0.005em; font-feature-settings: "tnum" 0; }

/* 버튼: 주 동작은 피오르, 보조는 선 */

/* 입력 */
.lform input:not([type=checkbox]), .lform select, .pick select, .pick input, .logform select, .logform textarea, .ask textarea, .askf input,
.p-add select, .p-mic2 select, .relgrid input, .setgrid input, .p-ned textarea, .ibedit textarea, .axtbl input, .phase select {
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--panel); transition: border-color .15s;
}

/* 상단 막대 */
.topbar { border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); margin-bottom: 28px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 680; letter-spacing: -0.02em; font-size: 16px; color: var(--ink); }

.uchip b { font-weight: 640; }
.phase select { border-style: solid; border-color: var(--line); background: transparent; }

/* 세부 메뉴: 알약형 */

/* 면: 흰 종이, 가는 선, 둥근 모서리. 상단 굵은 띠는 없앰 */
.panel { background: var(--panel); border: 1px solid var(--line); border-top: 1px solid var(--line); border-radius: var(--radius); overflow: clip; }
.phead { border-bottom: 0; padding: 18px 22px 4px; }

.stepper button { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); transition: border-color .15s; }
.stepper button:hover:not([disabled]) { border-color: var(--signal); }

/* ---------- 로그인: 역량 지형(움직이는 등고선) ---------- */

/* v9b: 머리줄 정리 · 지형 그림 영역 */

    { k: '총 소요 시간', v: `기준의 ${Math.round(ratio)}%`, std: `경고 ${R.totalWarn}% 미만 · 심각 ${R.totalBad}% 미만`, lv: lv(ratio, R.totalWarn, R.totalBad, true), d: '전체 응시 시간 ÷ 문항 유형별 기준 시간의 합' }

/* ---------- 가상 코호트(예시) ----------
   실제 진단 응답·수강 이력이 연계되기 전, 비교·유사 학생·위원회 화면의 구조를 보여 주기 위한 가상 데이터입니다.
   실제 연계 시 이 함수 대신 학번 기준으로 결합한 집계 데이터를 사용합니다. */
const COHORT_N = 900; let MIN_GROUP = 10;
function gauss(rnd) { return Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(2 * Math.PI * rnd()); }
const SUBNAMES = ITEMS.map(it => it.s);
const SUB_AREA = ITEMS.map(it => it.a);

function buildCohort() {
  const rnd = seededRand(2026);
  const depts = CURRICULUM.depts.filter(d => d !== POOL);
  const wts = depts.map(() => 0.5 + rnd());
  const tot = wts.reduce((a, b) => a + b, 0);
  const shift = { 공학: [-2, 6, 0, 0, -1, 5, 1], 서비스: [6, -2, 0, 1, 4, 0, 2], '디자인·기타': [2, -4, 3, 2, 0, 0, 0] };
  const subShift = { 시간관리능력: -10, 갈등관리능력: -9, 산업안전보건의식: -4, 적응학습능력: -6, 리더십: -5 };
  const cl = v => Math.max(0, Math.min(100, Math.round(v)));
  /* 과목별 운영 품질(가상): 과목명 해시로 약 15%는 효과가 거의 없고 15%는 약하게 둠(효과성 분석 시연용) */
  const quality = n => { let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) % 997; return h % 100 < 15 ? 0.1 : h % 100 < 30 ? 0.55 : 1; };
  const strength = c => 5.5 * (c.c === '직업기초' ? 1.25 : c.c === '일반' ? 0.8 : 1) * quality(c.n);
  const out = [];
  for (let i = 0; i < COHORT_N; i++) {
    let r = rnd() * tot, di = 0;
    while (di < depts.length - 1 && r > wts[di]) { r -= wts[di]; di++; }
    const dept = depts[di], grp = CURRICULUM.deptGroup[dept] || '디자인·기타';
    const theta = 56 + 13 * gauss(rnd);
    const tru = SUBNAMES.map((n, k) => theta + shift[grp][SUB_AREA[k]] + (subShift[n] || 0) + 11 * gauss(rnd));
    const sub0 = tru.map(v => cl(v + 7 * gauss(rnd)));
    out.push({ dept, yr: 1, grp, tru, sub: sub0, courses: [], taken: [[], [], []], picks: [], micro: null, mterm: 0 });
  }
  out.forEach(st => {
    const need = {}; st.sub.forEach((v, k) => { need[SUBNAMES[k]] = Math.max(0, (70 - v) / 70); });
    const list = offered(st.dept, 1);
    const wt = list.map(c => 0.4 + 2.2 * c.subs.reduce((a, x) => a + (need[x] || 0), 0));
    const picked = new Set();
    for (let t = 0; t < 3 && picked.size < list.length; t++) {
      let r = rnd() * wt.reduce((a, b, j) => a + (picked.has(j) ? 0 : b), 0), j = 0;
      for (; j < list.length - 1; j++) { if (picked.has(j)) continue; if (r <= wt[j]) break; r -= wt[j]; }
      picked.add(j);
      const term = 1 + Math.floor(rnd() * 3);
      st.courses.push(list[j].n); st.taken[term - 1].push(list[j].n); st.picks.push({ c: list[j], term });
    }
    const mic = CURRICULUM.micro.filter(m => eligible(m, st.dept));
    const mw = mic.map(m => 0.15 + 1.4 * m.subs.reduce((a, x) => a + (need[x] || 0), 0) / Math.max(1, m.subs.length));
    if (mic.length && rnd() < 0.42) {
      let r = rnd() * mw.reduce((a, b) => a + b, 0), j = 0;
      for (; j < mic.length - 1; j++) { if (r <= mw[j]) break; r -= mw[j]; }
      st.micro = mic[j].id; st.mterm = 2 + Math.floor(rnd() * 2);
    }
    // 재진단: 시간 경과에 따른 자연 성장 + 이수 효과(가상) + 측정 오차
    const mp = st.micro ? CURRICULUM.micro.find(m => m.id === st.micro) : null;
    st.traceSub = [st.sub];
    for (let t = 1; t <= 3; t++) {
      st.traceSub.push(SUBNAMES.map((sn, k) => {
        let eff = 0;
        st.picks.forEach(pk => { if (pk.term <= t && pk.c.subs.includes(sn)) eff += strength(pk.c); });
        if (mp && st.mterm <= t && mp.subs.includes(sn)) eff += 6.5;
        return cl(st.tru[k] + 1.2 * t + Math.min(eff, 16) + 7 * gauss(rnd));
      }));
    }
    st.traceArea = st.traceSub.map(sv => AREAS.map((_, a) => Math.round(sv.reduce((acc, v, k) => acc + (SUB_AREA[k] === a ? v : 0), 0) / 3)));
    st.area = st.traceArea[0];
    rnd(); rnd(); /* 기존 코호트 값 유지를 위한 난수 순서 보존 */
    const r1 = rnd();
    st.rel = r1 < 0.04 ? '재실시' : r1 < 0.13 ? '주의' : '정상';
    st.relCount = st.rel === '재실시' ? (rnd() < 0.35 ? 2 : 1) : 0;
    st.basicLow = st.sub.reduce((a, b) => a + b, 0) / st.sub.length < 45 && rnd() < 0.7;
    st.suppDone = rnd() < 0.45;
  });
  /* 핵심역량(인재상 3축)·기초학습(3과목) 재진단과 비교과 참여(가상). 별도 난수를 써서 위 값은 그대로 둠.
     비교과 효과는 연계 인재상 축에만 넣음(일부 프로그램은 효과를 작게 둠) */
  const rn = seededRand(4049);
  const NCEFF = { 'AI·DX 특강': 2.5, '창의융합 2D&3D 체험 튜터링': 3, '학과맞춤형 AI·DX 멘토링': 6.5, '전공과 AI융합경진대회': 7, '3D 프린팅 크리에이티브 공모전': 0.5, 'AI·DX 아이디어 공모전': 4.5, '크리에이티브 DX 공모전': 0 };
  out.forEach(st => {
    const th = st.tru.reduce((a, b) => a + b, 0) / st.tru.length;
    st.nc = [];
    NONCURR.forEach(p => { if (rn() < (p.in === 1 ? 0.3 : p.in === 2 ? 0.16 : 0.1)) st.nc.push({ n: p.n, term: 1 + Math.floor(rn() * 3), ax: p.in - 1 }); });
    const ax0 = [2, 0, -2].map(o => th - 4 + o + 9 * gauss(rn));
    st.coreTrace = [0, 1, 2, 3].map(t => ax0.map((v, a) => cl(v + 1.0 * t + st.nc.filter(x => x.ax === a && x.term <= t).reduce((acc, x) => acc + NCEFF[x.n], 0) + 6 * gauss(rn))));
    const b0 = [(st.tru[0] + st.tru[1]) / 2, (st.tru[3] + st.tru[4] + st.tru[5]) / 3, st.tru[2]].map(v => v - 3 + 8 * gauss(rn));
    st.basicTrace = [0, 1, 2, 3].map(t => b0.map(v => cl(v + 1.5 * t + (st.basicLow && st.suppDone && t >= 1 ? 7 : 0) + 7 * gauss(rn))));
  });
  out.forEach((st, i) => { st.no = `2026${String(1001 + i)}`; st.alias = `학생 ${String(i + 1).padStart(3, '0')}`; });
  return out;
}
let COHORT = null;
function cohort() {
  if (!COHORT) {

  }

}
const topPct = (arr, v) => Math.max(1, Math.round((arr.filter(x => x > v).length + 0.5 * arr.filter(x => x === v).length) / arr.length * 100));
function compareHtml(vals) {

function similarHtml(vals, list, recNames) {

}

function planTable(recs, yr) {
  const uniq = new Map();
  recs.forEach(r => { if (!uniq.has(r.c.n)) uniq.set(r.c.n, { c: r.c, subs: [r.sub] }); else uniq.get(r.c.n).subs.push(r.sub); });
  const rows = [];
  for (let y = yr; y <= 3; y++) ['1학기', '2학기'].forEach(t => rows.push({ y, t, label: `${y}학년 ${t}`, items: [] }));
  const free = { label: '학기 미확정', note: '교내 공통 선택 또는 계절학기 개설 과목입니다. 개설 시 확인하세요.', items: [] };
  uniq.forEach(v => {
    const cand = v.c.src === '소속 학과 교과과정' ? v.c.t.filter(t => t.yr >= yr && (t.term === '1학기' || t.term === '2학기')) : [];
    const pick = cand.sort((a, b) => a.yr - b.yr || a.term.localeCompare(b.term))[0];
    const row = pick && rows.find(r => r.y === pick.yr && r.t === pick.term);
    const cr = pick ? pick.credit : (v.c.t[0] ? v.c.t[0].credit : null);
    (row || free).items.push({ n: v.c.n, subs: v.subs, cr });
  });
  const all = rows.concat([free]).filter(r => r.items.length);
  const sum = r => r.items.reduce((a, i) => a + (i.cr || 0), 0);
  const max = Math.max(1, ...all.map(sum));
  return all.length ? `<div class="plan" role="table" aria-label="학기별 수강 계획표">` + all.map(r => `
    <div class="plan-row" role="row">
      <div class="plan-term" role="cell"><b>${r.label}</b>${r.note ? `<span class="meta">${r.note}</span>` : ''}</div>
      <ul class="plan-items" role="cell">${r.items.map(i => `<li>${i.n} <span class="meta">${[...new Set(i.subs)].join('·')}${i.cr ? ' · ' + i.cr + '학점' : ''}</span></li>`).join('')}</ul>
      <div class="plan-load" role="cell"><div class="bar" aria-hidden="true"><b style="width:${sum(r) / max * 100}%"></b></div><span class="lv">${sum(r)}학점</span></div>
    </div>`).join('') + `</div>` : '<p class="meta">추천 과목이 없습니다.</p>';
}

function buildPlan(job) {
  job = job || (state.targetJob ? JOBS.find(j => j.id === state.targetJob) : null);

  (CURRICULUM.byDept[dept] || []).forEach(c => {
    if (items.some(i => i.n === c.n)) return;
    const t = c.t.find(x => x.term === '1학기' || x.term === '2학기') || c.t[0];
    const term = t ? `${t.yr}-${t.term === '2학기' ? 2 : 1}` : terms[0];
    items.push({ n: c.n, cr: t ? t.credit : 2, subs: c.subs, cat: c.c, kind: 'base', term: terms.includes(term) ? term : terms[0] });
  });
  const list = offered(dept, 1);
  let budget = 0; /* 추천 교양은 선택: 기본 계획에는 넣지 않고, 학생이 '③ 추천 교육과정'에서 고를 때만 들어감 */
  const weakAll = dd.subs.filter(x => x.v < HIGH).sort((a, b) => a.v - b.v);
  const order = job
    ? Object.entries(job.core).map(([sn, t]) => ({ s: sn, v: dd.subs.find(y => y.s === sn).v, t })).filter(x => x.v < x.t).sort((a, b) => (b.t - b.v) - (a.t - a.v))
        .map(x => ({ s: x.s, v: x.v, want: x.t - x.v >= 30 ? 2 : 1 })).concat(weakAll.filter(x => !(x.s in job.core)).map(x => ({ s: x.s, v: x.v, want: 1 })))
    : weakAll.map(x => ({ s: x.s, v: x.v, want: x.v < MID ? 2 : 1 }));
  order.forEach(x => {
    const want = x.want;
    let have = items.filter(i => i.subs.includes(x.s)).length;
    for (const c of courseRecs(list.filter(c => !items.some(i => i.n === c.n)), x.s)) {
      if (have >= want || budget <= 0) break;
      const cr = c.t[0] ? c.t[0].credit : 2;
      const term = firstFree(items, terms, cr);
      if (!term) break;
      items.push({ n: c.n, cr, subs: c.subs, cat: c.c, kind: 'rec', why: x.s, term });
      have++; budget--;

     기본 계획에는 교양만 넣고, 융합과정과 비교과는 학생이 고를 때만 계획에 들어갑니다(추천은 화면에 따로 보여 줌). */

/* 이수 계획 드래그 앤 드롭: 마우스는 과목 어디서나, 터치는 ⠿ 손잡이로 끌기 */
const hasBatchim = w => { w = w.replace(/[\s」』"')\]]+$/, ''); const c = w.slice(-1).charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 ? (c - 0xAC00) % 28 !== 0 : /[013678lmn]$/i.test(w); };
const eul = w => w + (hasBatchim(w) ? '을' : '를');
const eun = w => w + (hasBatchim(w) ? '은' : '는');
function enablePlanDnd(plan, list, terms) {
  let drag = null;
  const say = (text, warn) => { state.dmsg = { text, warn }; };
  const targetAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('[data-drop]'); };
  const clear = () => document.querySelectorAll('.over').forEach(el => el.classList.remove('over'));
  const start = (e, src) => {
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest('select, button, input')) return;
    if (e.pointerType === 'touch' && !e.target.closest('.grip')) return;
    const r = src.getBoundingClientRect();
    drag = { src, sx: e.clientX, sy: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, ghost: null, id: e.pointerId };
    src.setPointerCapture(e.pointerId);
  };
  const move = e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.ghost) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
      drag.ghost = drag.src.cloneNode(true);
      drag.ghost.classList.add('drag-ghost'); drag.ghost.style.width = drag.w + 'px';
      document.body.appendChild(drag.ghost); drag.src.classList.add('dragging');
    }
    e.preventDefault();
    drag.ghost.style.transform = `translate(${e.clientX - drag.dx}px, ${e.clientY - drag.dy}px)`;
    drag.x = e.clientX; drag.y = e.clientY;
    clear(); const t = targetAt(e.clientX, e.clientY); if (t) t.classList.add('over');
    if (!drag.loop) {
      drag.loop = true;
      const tick = () => {
        if (!drag || !drag.ghost) return;
        const edge = 80, sp = drag.y < edge ? -(edge - drag.y) / 4 : drag.y > window.innerHeight - edge ? (drag.y - window.innerHeight + edge) / 4 : 0;
        if (sp) { window.scrollBy(0, sp); clear(); const t2 = targetAt(drag.x, drag.y); if (t2) t2.classList.add('over'); }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
  };
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null; clear();
    document.querySelectorAll('.drag-ghost').forEach(g => g.remove());
    if (!d.ghost) return;
    d.src.classList.remove('dragging');
    const t = targetAt(e.clientX, e.clientY);
    if (!t) return;
    const where = t.dataset.drop;
    if (d.src.dataset.idx !== undefined) {
      const it = plan.items[Number(d.src.dataset.idx)];
      if (where === 'trash') {
        if (it.kind === 'base') { say(`${eun('「' + it.n + '」')} 학과 편성 과목이라 뺄 수 없습니다.`, true); renderPlan(); return; }
        plan.items.splice(Number(d.src.dataset.idx), 1); say(`${eul('「' + it.n + '」')} 계획에서 뺐습니다.`);
      } else {
        if (it.kind === 'base') { say(`${eun('「' + it.n + '」')} 학과 편성 과목이라 ${termName(it.term)}에 고정됩니다.`, true); renderPlan(); return; }
        if (it.term === where) return;
        it.term = where; say(`${eul('「' + it.n + '」')} ${termName(where)}로 옮겼습니다.`);
        warnTerm(it, where);
      }
    } else if (d.src.dataset.cand && where !== 'trash') {
      const c = list.find(x => x.n === decodeURIComponent(d.src.dataset.cand));
      const it = { n: c.n, cr: c.t[0] ? c.t[0].credit : 2, subs: c.subs, cat: c.c, kind: 'added', term: where };
      plan.items.push(it); say(`${eul('「' + c.n + '」')} ${termName(where)}에 넣었습니다.`);
      warnTerm(it, where);
    } else return;
    renderPlan();
  };
  function warnTerm(it, term) {
    const ge = credits(plan.items, term, ['base', 'rec', 'added']);
    const c = list.find(x => x.n === it.n);
    const sem = term.endsWith('2') ? '2학기' : '1학기';
    const notes = [];
    if (it.kind !== 'micro' && ge > CAP) notes.push(`${termName(term)} 교양이 ${ge}학점으로 권장 상한 ${CAP}학점을 넘습니다`);
    if (c && c.src === '소속 학과 교과과정' && c.t.length && !c.t.some(x => x.term === sem)) notes.push(`이 과목은 ${[...new Set(c.t.map(x => x.term))].join('·')}에 개설됩니다`);
    if (notes.length) say(`${state.dmsg.text} ${notes.join('. ')}.`, true);
  }
  document.querySelectorAll('.chip:not(.fixed), .cand').forEach(el => {
    el.addEventListener('pointerdown', e => start(e, el));
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', () => { if (drag && drag.ghost) { drag.ghost.remove(); drag.src.classList.remove('dragging'); } drag = null; clear(); });
  });
}

function addToPlan(name) {

}

const UNIT_COURSE = ['의사소통과AI윤리및디지털시민의식', '수리와AI윤리및디지털시민의식', '문제해결과AI윤리및디지털시민의식', '자기개발과AI윤리및디지털시민의식', '조직이해능력과AI윤리및디지털시민', 'AI와빅데이터리터러시', '직업윤리와AI윤리및디지털시민의식'];
const OWN_DEPTS = () => CURRICULUM.depts.filter(d => d !== POOL);
const deptsWith = pred => OWN_DEPTS().filter(d => (CURRICULUM.byDept[d] || []).some(pred));
function gapRows() {
  const co = cohort(), n = co.length;
  return SUBNAMES.map((sn, k) => {
    const mean_ = Math.round(co.reduce((a, st) => a + st.sub[k], 0) / n);
    const cur = deptsWith(c => c.subs.includes(sn));
    const ratio = cur.length / CURRICULUM.nDepts;
    let verdict = '양호';
    if (mean_ < 55 && ratio < 0.15) verdict = '신설·개편 우선'; else if (mean_ < 55) verdict = '운영 점검'; else if (ratio < 0.15) verdict = '관찰';
    const needy = co.filter(st => st.sub[k] < 40).length;
    return { sn, k, mean: mean_, cur, ratio, verdict, needy };
  });
}
function proposals() {
  const co = cohort(), out = [];
  gapRows().filter(r => r.verdict !== '양호').forEach(r => {
    const area = SUB_AREA[r.k], unit = UNIT_COURSE[area];
    const unitDepts = deptsWith(c => c.n === unit);
    if (unitDepts.length) out.push({ id: `u${r.k}`, sub: r.sn, type: '단원 보강', title: `직업기초 과목 「${unit}」에 ${r.sn} 단원을 보강`, depts: unitDepts, pool: false, note: `${unitDepts.length}개 학과에 이미 편성된 과목을 고치는 안이라 편성 부담이 작습니다.` });
    const names = {}; OWN_DEPTS().concat([POOL]).forEach(d => (CURRICULUM.byDept[d] || []).forEach(c => { if (c.subs.includes(r.sn)) names[c.n] = c; }));
    const best = Object.keys(names).sort((a, b) => (estEffect(b) || 0) - (estEffect(a) || 0))[0];
    if (best) {
      const lack = OWN_DEPTS().filter(d => !r.cur.includes(d)).map(d => ({ d, m: (x => x.length ? x.reduce((a, st) => a + st.sub[r.k], 0) / x.length : 99)(co.filter(st => st.dept === d)) })).sort((a, b) => a.m - b.m).slice(0, 8).map(x => x.d);
      out.push({ id: `e${r.k}`, sub: r.sn, type: '확대 편성', title: `「${best}」을 미편성 학과 중 평균이 낮은 8개 학과에 편성`, depts: lack, pool: false, note: lack.join(', ') });
    }
    out.push({ id: `n${r.k}`, sub: r.sn, type: '공통 교양 신설', title: `교내 공통 선택 교양 신설(가칭 「${shortSub(r.sn)} 실습」)`, depts: [], pool: true, note: '모든 학과 학생이 선택할 수 있습니다.' });
    const mic = CURRICULUM.micro.filter(m => !m.blocked && m.subs.includes(r.sn))[0];
    if (mic) out.push({ id: `m${r.k}`, sub: r.sn, type: '융합과정 연계', title: `「${mic.name}」 수강 안내 강화와 정원 확대`, depts: [], pool: false, micro: mic.id, note: mic.cert });
    const wc = impact().rows.find(x => x.subs.includes(r.sn) && x.verdict === '불확실' && x.n >= 30);
    if (wc) out.push({ id: `r${r.k}`, sub: r.sn, type: '과목 개편', title: `「${wc.nm}」 내용·운영 개편`, depts: [], pool: false, note: `보정 효과 ${wc.eff.toFixed(1)}점(±${wc.ci.toFixed(1)}), 효과가 뚜렷하지 않음` });
  });
  return out;
}
function simulate(sel) {
  const co = cohort(), rows = gapRows().filter(r => r.verdict !== '양호');
  return rows.map(r => {
    const ps = sel.filter(x => x.sub === r.sn);
    const after = new Set(r.cur); ps.forEach(x => x.depts.forEach(d => after.add(d)));
    const poolNew = ps.some(x => x.pool), mic = ps.find(x => x.micro);
    const needy = co.filter(st => st.sub[r.k] < 40);
    const before = needy.filter(st => r.cur.includes(st.dept)).length;
    const aft = needy.filter(st => after.has(st.dept)).length;
    const poolNow = (CURRICULUM.byDept[POOL] || []).filter(c => c.subs.includes(r.sn) && !/유학생|전공심화/.test(c.note)).length;
    const micM = mic && CURRICULUM.micro.find(m => m.id === mic.micro);
    const micReach = micM ? needy.filter(st => eligible(micM, st.dept)).length : 0;
    return { r, ps, before, aft, needy: needy.length, deptsBefore: r.cur.length, deptsAfter: after.size, poolNow, poolAfter: poolNow + (poolNew ? 1 : 0), micReach, micName: micM ? micM.name : '' };
  });
}

function renderCommittee() {
  const co = cohort(), n = co.length;

/* ---------- 교원: 수준별 자동 분반 ---------- */
const LV3 = v => (v >= HIGH ? '상' : v >= MID ? '중' : '하');
function renderSections() {
  const co = cohort();
  const list = offered(state.dept, 1).filter(c => c.subs.length);
  if (!state.secCourse || !list.some(c => c.n === state.secCourse)) state.secCourse = (list.find(c => c.c === '직업기초') || list[0]).n;
  const course = list.find(c => c.n === state.secCourse);
  const k = state.secN || 3, mode = state.secMode || 'level';
  const idx = course.subs.map(sn => SUBNAMES.indexOf(sn));
  const roster = co.filter(st => st.dept === state.dept).map(st => ({ st, v: Math.round(idx.reduce((a, i) => a + st.sub[i], 0) / idx.length) }));
  const unc = roster.filter(r => r.st.rel === '재실시');
  const ok = roster.filter(r => r.st.rel !== '재실시').sort((a, b) => b.v - a.v);
  let groups;
  if (mode === 'level') {
    const by = { 상: ok.filter(r => LV3(r.v) === '상'), 중: ok.filter(r => LV3(r.v) === '중'), 하: ok.filter(r => LV3(r.v) === '하') };
    const order = ['상', '중', '하'].filter(l => by[l].length);
    groups = Array.from({ length: k }, () => []);
    if (k >= order.length) {
      let gi = 0; const sizes = order.map(l => by[l].length), extra = k - order.length;
      const splits = order.map((l, i) => 1 + (extra > 0 && sizes[i] === Math.max(...sizes) && i === sizes.indexOf(Math.max(...sizes)) ? extra : 0));
      order.forEach((l, i) => { const n = splits[i], arr = by[l]; for (let j = 0; j < n; j++) groups[gi + j] = arr.slice(Math.floor(j * arr.length / n), Math.floor((j + 1) * arr.length / n)); gi += n; });
    } else {
      ok.forEach((r, i) => groups[Math.min(k - 1, Math.floor(i * k / ok.length))].push(r));
    }
  } else {
    groups = Array.from({ length: k }, () => []);
    ok.forEach((r, i) => groups[i % k].push(r));
  }
  if (state.secMoves) Object.entries(state.secMoves).forEach(([no, g]) => { groups.forEach(G => { const i = G.findIndex(r => r.st.no === no); if (i >= 0) { const [r] = G.splice(i, 1); if (groups[g]) groups[g].push(r); } }); });
  const stat = G => ({ n: G.length, avg: G.length ? Math.round(G.reduce((a, r) => a + r.v, 0) / G.length) : 0, mix: ['상', '중', '하'].map(l => G.filter(r => LV3(r.v) === l).length) });
  const cols = groups.map((G, gi) => { const S = stat(G); return `<div class="secol"><div class="sec-head"><b>${gi + 1}분반</b><span class="meta">${S.n}명 · 평균 ${S.avg}</span></div>
      <p class="meta">상 ${S.mix[0]} · 중 ${S.mix[1]} · 하 ${S.mix[2]}</p>
      <ul class="roster">${G.map(r => `<li><span>${r.st.alias}</span><span class="lvchip lv-${LV3(r.v)}">${LV3(r.v)} ${r.v}</span><select data-move="${r.st.no}" aria-label="${r.st.alias} 분반 이동">${groups.map((_, j) => `<option value="${j}" ${j === gi ? 'selected' : ''}>${j + 1}분반</option>`).join('')}</select></li>`).join('')}</ul></div>`; }).join('');
  $view.innerHTML = `
  <div class="dash-grid">
    <section class="panel p-sum"><p class="summary">수준별 자동 분반</p>
      <p class="meta">수강생의 진단 결과로 수준(상 ${HIGH}점 이상 · 중 ${MID}~${HIGH - 1}점 · 하 ${MID}점 미만)을 판정해 분반을 나눕니다. 교과목에 연결된 하위능력 점수의 평균을 씁니다. 신뢰성 재실시 대상은 '미분류'로 따로 둡니다. <span class="badge amber">가상 예시 데이터</span> 수강생은 ${state.dept} 신입생(가상)입니다.</p>
      <div class="pick" style="margin:10px 0 0">
        <label>교과목<select id="scourse">${list.map(c => `<option ${c.n === course.n ? 'selected' : ''}>${c.n}</option>`).join('')}</select></label>
        <label>분반 수<select id="sn">${[2, 3, 4].map(n => `<option ${n === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <label>나누는 방식<select id="smode"><option value="level" ${mode === 'level' ? 'selected' : ''}>수준별(상·중·하 기준)</option><option value="mixed" ${mode === 'mixed' ? 'selected' : ''}>수준 고르게 섞기</option></select></label>
      </div>
      <p class="meta">연계 하위능력: ${course.subs.join(', ')}${aiTag(course.n)} · 수강생 ${roster.length}명 · 미분류 ${unc.length}명</p>
    </section>
    <section class="panel p-board"><header class="phead"><h2>분반 결과</h2><span class="meta">학생 옆 선택 상자로 분반을 옮길 수 있습니다</span></header><div class="pbody">
      <div class="secgrid">${cols}</div>
      ${unc.length ? `<div class="secol unc"><div class="sec-head"><b>미분류</b><span class="meta">${unc.length}명 · 진단 재실시 필요</span></div><p class="meta">${unc.map(r => r.st.alias).join(', ')}</p></div>` : ''}
      <div class="actions no-print" style="margin-top:12px"><button class="btn" id="scsv">분반 명단 내려받기(CSV)</button><button class="btn ghost" id="sreset">조정 초기화</button></div>
    </div></section>
  </div>`;
  document.getElementById('scourse').onchange = e => { state.secCourse = e.target.value; state.secMoves = null; renderSections(); };
  document.getElementById('sn').onchange = e => { state.secN = Number(e.target.value); state.secMoves = null; renderSections(); };
  document.getElementById('smode').onchange = e => { state.secMode = e.target.value; state.secMoves = null; renderSections(); };
  document.getElementById('sreset').onclick = () => { state.secMoves = null; renderSections(); };
  $view.querySelectorAll('[data-move]').forEach(sel => sel.onchange = () => { state.secMoves = state.secMoves || {}; state.secMoves[sel.dataset.move] = Number(sel.value); renderSections(); });
  document.getElementById('scsv').onclick = () => {
    const rows = [['교과목', '분반', '학번', '이름(가명)', '수준', '점수']];
    groups.forEach((G, gi) => G.forEach(r => rows.push([course.n, `${gi + 1}분반`, r.st.no, r.st.alias, LV3(r.v), r.v])));
    unc.forEach(r => rows.push([course.n, '미분류', r.st.no, r.st.alias, '재실시 필요', '']));
    download(`분반_${course.n}.csv`, rows);
  };
}
function download(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- 교원: 지도 학생 상담 알림 ---------- */
function advisorAlerts() {
  const co = cohort(), A = state.alertStd || { drop: 0, lowCount: 3 };
  return co.filter(st => st.dept === state.dept).map(st => {
    const t0 = st.traceArea[0], t1 = st.traceArea[1];
    const d = t1.reduce((a, v, i) => a + v - t0[i], 0) / t1.length;
    const lowBoth = SUBNAMES.filter((_, k) => st.traceSub[0][k] < MID && st.traceSub[1][k] < MID);
    const why = [];
    if (d < A.drop) why.push(`향상도 ${d.toFixed(1)}점(기준 ${A.drop}점 미만)`);
    if (lowBoth.length >= A.lowCount) why.push(`'하' 수준 2회 연속 ${lowBoth.length}개 능력`);
    if (st.relCount >= 2) why.push('진단 재실시 2회');
    if (st.basicLow && !st.suppDone) why.push('기초학습 낮음·보충 미이수');
    return { st, d, lowBoth, why };
  }).filter(x => x.why.length);
}
/* ---------- 교원: 상담 준비 카드 ---------- */
const AGREE = ['보완 교양 수강', '학습 코칭·튜터링', '비교과 참여', '기초 보충 프로그램', '재진단 성실 응시', '진로·직무 상담', '학생상담센터 연계'];
function prepData(sel) {
  const st = sel.st, t1 = st.traceArea[1], ord = t1.map((v, k) => k).sort((a, b) => t1[b] - t1[a]);
  const lowSub = SUBNAMES.map((sn, k) => ({ sn, v: st.traceSub[1][k] })).sort((a, b) => a.v - b.v).slice(0, 3);
  const doneN = st.picks.filter(p => p.term <= 1).length, plannedN = st.picks.length;
  const nc1 = st.nc.filter(x => x.term <= 1).map(x => x.n);
  const qs = [];
  sel.why.forEach(w => {
    if (/향상도/.test(w)) qs.push('이번 학기에 들은 과목·활동 중 도움이 된 것과 그렇지 않은 것은 무엇인가요?');
    if (/'하'/.test(w)) qs.push(`${shortSub(lowSub[0].sn)} 관련 수업이나 과제에서 어떤 부분이 가장 어려웠나요?`);
    if (/재실시/.test(w)) qs.push('진단을 볼 때 시간이나 기기, 응답 환경에 어려움이 있었나요?');
    if (/기초학습/.test(w)) qs.push('기초 보충 프로그램에 참여하기 어려운 이유(시간·과목·정보)가 있나요?');
  });
  qs.push('다음 학기에 목표로 하는 직무나 진로가 있나요? 그에 맞춰 이수 계획을 함께 조정해 봅시다.');
  const crs = courseRecs(offered(st.dept, 1).filter(c => !st.courses.includes(c.n)), lowSub[0].sn)[0];
  const nc = NONCURR.find(p => p.subs.includes(lowSub[0].sn) && !st.nc.some(x => x.n === p.n));
  return { st, strong: ord.slice(0, 2).map(k => `${AREAS[k].short} ${t1[k]}`), weak: ord.slice(-2).reverse().map(k => `${AREAS[k].short} ${t1[k]}`), gain: mean(t1) - mean(st.traceArea[0]),
    lowSub, doneN, plannedN, nc1, qs: [...new Set(qs)].slice(0, 4), crs, nc, micro: st.micro ? CURRICULUM.micro.find(m => m.id === st.micro).name : null };
}

const GRADE_COLS = ['학번', '성명', '학과', '연도', '학기', '교과목코드', '교과목명', '이수구분', '학점', '성적'];
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function validateGrades(rows) {
  const catalog = new Set(CURRICULUM.depts.flatMap(d => (CURRICULUM.byDept[d] || []).map(c => c.n)).concat(CURRICULUM.micro.flatMap(m => m.courses.map(c => c.n))).concat(NONCURR.map(p => p.n)));
  const head = rows[0].map(h => h.trim());
  const miss = GRADE_COLS.filter(c => !head.includes(c));
  if (miss.length) return { fatal: `필수 열이 없습니다: ${miss.join(', ')}. 양식을 내려받아 열 이름을 맞춰 주세요.` };
  const ix = Object.fromEntries(GRADE_COLS.map(c => [c, head.indexOf(c)]));
  const seen = new Set(), out = [];
  rows.slice(1).forEach((r, i) => {
    const g = c => (r[ix[c]] || '').trim(), err = [], warn = [];
    if (!/^\d{8}$/.test(g('학번'))) err.push('학번은 숫자 8자리');
    if (!['1', '2', '1학기', '2학기', '여름', '겨울'].includes(g('학기'))) err.push('학기 값(1·2·여름·겨울)');
    const cr = Number(g('학점')); if (g('학점') === '' || isNaN(cr) || cr < 0 || cr > 6) err.push('학점은 0~6 숫자');
    if (!['교양', '전공', '비교과', '융합'].includes(g('이수구분'))) err.push('이수구분(교양·전공·비교과·융합)');
    if (g('교과목명') && !catalog.has(g('교과목명').replace(/\s/g, '')) && !catalog.has(g('교과목명'))) warn.push('플랫폼에 없는 교과목(역량 매핑 필요)');
    const key = [g('학번'), g('교과목명'), g('연도'), g('학기')].join('|');
    if (seen.has(key)) err.push('같은 학번·교과목·학기 중복'); seen.add(key);
    out.push({ line: i + 2, r, err, warn, no: g('학번'), course: g('교과목명'), cr });
  });
  return { rows: out };
}

/* ======================================================================

   - 점수 계산·판정·추천은 재현 가능한 규칙으로 하고, AI는 그 근거(수치)만 받아 해석 문장을 씁니다.

async function aiAnalyze(kind, data) {
  if (!(await checkAI())) return null;
  try {
    const r = await aiFetch('analyze', { kind, data });
    if (!r.ok) return null;
    const j = await r.json();
    return j.result ? { ...j.result, model: j.model, ai: true } : null;
  } catch (e) { return null; }
}
async function ensureAI(key, kind, data, step) {
  state.aiRes = state.aiRes || {}; state.aiPend = state.aiPend || {};
  if (key in state.aiRes || state.aiPend[key]) return;
  if (!(await checkAI())) { state.aiRes[key] = null; return; }
  state.aiPend[key] = true;
  if (state.step === step) render();
  const r = await aiAnalyze(kind, data);
  state.aiPend[key] = false;
  state.aiRes[key] = r;
  if (state.step === step) render();
}
function aiStatus(key) {

const dataPeek = (data, label) => `<details class="peek no-print"><summary>${label || 'AI에 보내는 근거 데이터 보기'}</summary><pre>${esc(JSON.stringify(data, null, 1)).slice(0, 6000)}</pre><p class="meta">성명·학번 등 식별 정보는 보내지 않습니다.</p></details>`;

/* ======================================================================
   모듈 A. AI 진단 결과 분석

let PROFILES = null;
/* 역량 프로파일 유형: 가상 코호트의 입학 직후 7영역 점수에서 개인 평균을 뺀 '모양'으로 k-평균(4개 유형) */
function profiles() {
  if (PROFILES) return PROFILES;
  const co = cohort(), K = 4;
  const shape = v => { const m = mean(v); return v.map(x => x - m); };
  const X = co.map(st => shape(st.traceArea[0]));
  const d2 = (a, b) => a.reduce((s, v, k) => s + (v - b[k]) ** 2, 0);
  const norm = X.map(x => d2(x, x.map(() => 0)));
  const C = [X[norm.indexOf(Math.max(...norm))].slice()];
  while (C.length < K) { const far = X.map(x => Math.min(...C.map(c => d2(x, c)))); C.push(X[far.indexOf(Math.max(...far))].slice()); }
  let lab = [];
  for (let it = 0; it < 40; it++) {
    lab = X.map(x => { const ds = C.map(c => d2(x, c)); return ds.indexOf(Math.min(...ds)); });
    for (let j = 0; j < K; j++) { const m = X.filter((_, i) => lab[i] === j); if (m.length) C[j] = AREAS.map((_, a) => mean(m.map(x => x[a]))); }
  }
  const types = C.map((c, j) => {
    const idx = c.map((v, a) => a).sort((a, b) => c[b] - c[a]);
    const mem = co.filter((_, i) => lab[i] === j);
    const name = `${AREAS[idx[0]].short}·${AREAS[idx[1]].short} 강점형`;
    // 같은 유형 안에서 이수 후 연계 능력 향상이 컸던 교양(입학 직후 점수 보정, 이수 15명 이상)
    const cnt = {}; mem.forEach(st => st.picks.forEach(pk => { cnt[pk.c.n] = cnt[pk.c.n] || { c: pk.c, n: 0 }; cnt[pk.c.n].n++; }));
    const good = Object.values(cnt).filter(x => x.n >= 15 && x.c.subs.length && x.n <= mem.length - 15).map(x => {
      const S = x.c.subs.map(s => SUBNAMES.indexOf(s)).filter(k => k >= 0);
      const y = mem.map(st => mean(S.map(k => st.traceSub[3][k]))), x0 = mem.map(st => mean(S.map(k => st.traceSub[0][k])));
      const fit = ols(mem.map((st, i) => [1, x0[i], st.courses.includes(x.c.n) ? 1 : 0]), y);
      return { n: x.c.n, subs: x.c.subs, takers: x.n, eff: fit.b[2], ci: 1.96 * fit.se[2] };
    }).filter(x => x.eff - x.ci > 0).sort((a, b) => b.eff - a.eff).slice(0, 4);
    return { j, name, strong: idx.slice(0, 2), weak: idx.slice(-2).reverse(), centroid: AREAS.map((_, a) => Math.round(mean(mem.map(st => st.traceArea[0][a])))), share: mem.length / co.length * 100, n: mem.length, good };
  });
  PROFILES = { C, types, shape, d2 };
  return PROFILES;
}
function myProfile(vals) {
  const P = profiles(), x = P.shape(vals), ds = P.C.map(c => P.d2(x, c));
  return P.types[ds.indexOf(Math.min(...ds))];
}
function analysisFeatures() {

  const job = state.targetJob ? JOBS.find(j => j.id === state.targetJob) : null;
  const linkBasic = { 문서소통능력: 0, 구두소통능력: 0, 연산능력: 1, 통계활용능력: 1, 도표활용능력: 1, 외국어소통능력: 2 };

    const cm = Math.round(mean(co.map(st => st.sub[x.k])));
    if (x.v <= cm - 10) { s += 8; why.push(`대학 평균(${cm}점)보다 ${cm - x.v}점 낮음`); }
    if (job && job.core[x.s]) { s += 15; why.push(`목표 직무 '${job.name}' 필요 역량(목표 ${job.core[x.s]}점)`); }
    if (x.s in linkBasic && basic[linkBasic[x.s]].v < MID) { s += 10; why.push(`기초학습 ${BASIC_SUBJ[linkBasic[x.s]]}도 낮음`); }
    const crs = courseRecs(list, x.s)[0], nc = NONCURR.find(p => p.subs.includes(x.s));
    return { s: x.s, v: x.v, score: s, why, course: crs ? { n: crs.n, term: termText(crs) } : null, nc: nc ? `${nc.n}(${nc.in}-IN)` : null };
  }).filter(x => x.score > 0 && x.v < HIGH).sort((a, b) => b.score - a.score).slice(0, 3);
  const risks = [];
  if (rel.verdict !== '정상') risks.push(`응답 신뢰성 '${rel.verdict}' 판정이라 결과를 조심해서 해석해야 합니다.`);

  const nLow = dd.subs.filter(x => x.v < MID).length;

  if (sp.self - sp.perf >= 20) risks.push(`자기평가(${sp.self}점)가 수행 문항 점수(${sp.perf}점)보다 높습니다. 스스로 생각하는 수준과 실제 수행 사이에 차이가 있을 수 있습니다.`);
  if (sp.perf - sp.self >= 20) risks.push(`수행 문항 점수(${sp.perf}점)가 자기평가(${sp.self}점)보다 높습니다. 자신감을 높이는 경험이 도움이 됩니다.`);
  const prof = myProfile(dd.vals);
  return {
    dept: state.dept, group: CURRICULUM.deptGroup[state.dept] || '미분류', reliability: rel.verdict,
    ncs: { avg, level: level(avg), top_pct_univ: topPct(co.map(st => mean(st.area)), avg), top_pct_dept: mine.length >= MIN_GROUP ? topPct(mine.map(st => mean(st.area)), avg) : null,
      areas: AREAS.map((a, k) => ({ area: a.short, score: dd.vals[k], level: level(dd.vals[k]), univ_avg: AVG[k] })), low_subs: dd.subs.filter(x => x.v < MID).map(x => `${x.s} ${x.v}`) },
    core: CORE_AXES.map((a, i) => ({ axis: a, score: core.axes[i], in_step: `${i + 1}-IN` })),
    basic: basic.map(b => ({ subject: b.sub, score: b.v, level: level(b.v) })),

function ruleAnalysis(F) {
  const A = F.ncs.areas.slice().sort((a, b) => b.score - a.score);
  const strong = A.slice(0, 2), weak = A.slice(-2).reverse();
  const lowAx = F.core.slice().sort((a, b) => a.score - b.score)[0];
  const strengths = [`직업기초 ${strong.map(a => `${a.area}(${a.score}점)`).join(', ')} 영역이 상대적으로 높습니다.`];
  const topCore = F.core.slice().sort((a, b) => b.score - a.score)[0];
  if (topCore.score >= HIGH) strengths.push(`핵심역량에서 '${topCore.axis}' 축이 ${topCore.score}점으로 높습니다.`);
  F.basic.filter(b => b.score >= HIGH).forEach(b => strengths.push(`기초학습 ${b.subject}가 '높음'입니다.`));
  const cautions = F.risks.slice();
  F.cross_check.filter(c => c.flag).forEach(c => cautions.push(`${c.a}(${c.av}점)와 ${c.b}(${c.bv}점)의 차이가 ${Math.abs(c.gap)}점입니다. 두 진단이 재는 내용이 다르거나 한쪽 응답이 정확하지 않을 수 있어, 상담에서 함께 확인하면 좋습니다.`));
  const actions = F.priorities.map(p => `${p.s}: ${p.course ? `교양 「${p.course.n}」(${p.course.term})` : '관련 교양'}${p.nc ? `, 비교과 ${p.nc}` : ''}`);
  actions.push(`핵심역량 '${lowAx.axis}' 축(${lowAx.score}점)을 키우는 ${lowAx.in_step} 단계 비교과를 먼저 들어 보세요.`);
  if (F.profile.effective_courses_same_type.length) actions.push(`나와 같은 '${F.profile.name}' 학생들에게 향상 효과가 컸던 과목: ${F.profile.effective_courses_same_type.slice(0, 3).join(', ')}`);

  const advisor_note = `[${F.dept} · ${F.profile.name}] 직업기초 평균 ${F.ncs.avg}점, 핵심역량 ${F.core.map(c => `${c.axis} ${c.score}`).join('/')}, 기초학습 ${F.basic.map(b => `${b.subject} ${b.level}`).join('/')}. 우선 보완: ${F.priorities.map(p => `${p.s}(${p.v})`).join(', ') || '없음'}. ${F.risks.length ? '확인 필요: ' + F.risks.length + '건(' + F.risks.map(r => r.split(':')[0].split('이라')[0]).join('; ') + ').' : '특이 사항 없음.'}`;

/* ======================================================================
   모듈 B. 역량 향상도 평가 (입학 직후 대비 학기말 재진단)
   ====================================================================== */
const GAIN_DIAG = {
  ncs: { name: '직업기초역량', dims: AREAS.map(a => a.short), get: (st, t) => st.traceArea[t] },
  core: { name: '핵심역량', dims: CORE_AXES, get: (st, t) => st.coreTrace[t] },
  basic: { name: '기초학습역량', dims: BASIC_SUBJ, get: (st, t) => st.basicTrace[t] }
};
function gainStats(dk, t, cut) {
  const G = GAIN_DIAG[dk], all = cohort(), co = all.filter(st => st.rel !== '재실시');
  const pre = co.map(st => mean(G.get(st, 0))), post = co.map(st => mean(G.get(st, t)));
  /* 재검사 신뢰도: 입학 직후와 1학기말 점수의 상관으로 추정(0.6~0.97로 제한). 실제 운영에서는 문항 분석으로 갱신 */
  const corr = (x, y) => { const mx = mean(x), my = mean(y); return x.reduce((a, v, i) => a + (v - mx) * (y[i] - my), 0) / Math.sqrt(x.reduce((a, v) => a + (v - mx) ** 2, 0) * y.reduce((a, v) => a + (v - my) ** 2, 0)); };
  const relOf = (x, y) => Math.max(0.6, Math.min(0.97, corr(x, y)));
  const rC = relOf(pre, co.map(st => mean(G.get(st, 1))));
  const sed = sd(pre) * Math.sqrt(2 * (1 - rC));
  const rows = co.map((st, i) => {
    const d = post[i] - pre[i], rci = d / sed, g = pre[i] < 100 ? d / (100 - pre[i]) : 0;
    const cls = rci >= 1.96 ? 'up' : rci <= -1.96 ? 'down' : 'same';
    return { st, pre: pre[i], post: post[i], d, rci, g, cls, below: d < cut || cls === 'down' };
  });
  const share = (arr, f) => (arr.length ? arr.filter(f).length / arr.length * 100 : 0);
  const dims = G.dims.map((nm, j) => {
    const a = co.map(st => G.get(st, 0)[j]), b = co.map(st => G.get(st, t)[j]), d = b.map((v, i) => v - a[i]);
    const s = sd(a) * Math.sqrt(2 * (1 - relOf(a, co.map(st => G.get(st, 1)[j]))));
    return { nm, pre: mean(a), post: mean(b), m: mean(d), ci: 1.96 * sd(d) / Math.sqrt(d.length), dz: mean(d) / sd(d), up: share(d, x => x / s >= 1.96), down: share(d, x => x / s <= -1.96) };
  });
  const sum = arr => ({ n: arr.length, m: arr.length ? mean(arr.map(r => r.d)) : 0, g: arr.length ? mean(arr.map(r => r.g)) : 0, up: share(arr, r => r.cls === 'up'), down: share(arr, r => r.cls === 'down'), below: arr.filter(r => r.below).length });
  const depts = [...new Set(rows.map(r => r.st.dept))].map(d => ({ d, ...sum(rows.filter(r => r.st.dept === d)) })).filter(x => x.n >= MIN_GROUP).sort((a, b) => a.m - b.m);
  const byLevel = [['입학 직후 하', r => r.pre < MID], ['입학 직후 중', r => r.pre >= MID && r.pre < HIGH], ['입학 직후 상', r => r.pre >= HIGH]].map(([k, f]) => ({ k, ...sum(rows.filter(f)) }));
  const byStudy = dk === 'core'
    ? [['비교과 참여', r => r.st.nc.some(x => x.term <= t)], ['비교과 미참여', r => !r.st.nc.some(x => x.term <= t)]]
    : dk === 'basic'
      ? [['기초 보충 이수', r => r.st.basicLow && r.st.suppDone], ['보충 대상·미이수', r => r.st.basicLow && !r.st.suppDone], ['보충 비대상', r => !r.st.basicLow]]
      : [['융합과정 이수', r => r.st.micro && r.st.mterm <= t], ['교양 2과목 이상', r => r.st.picks.filter(p => p.term <= t).length >= 2], ['교양 0~1과목', r => r.st.picks.filter(p => p.term <= t).length < 2]];
  const study = byStudy.map(([k, f]) => ({ k, ...sum(rows.filter(f)) }));
  const ds = rows.map(r => r.d);
  return { G, rC, dk, t, cut, n: rows.length, excl: all.length - co.length, rows, dims, depts, byLevel, study, sed, ...sum(rows), ci: 1.96 * sd(ds) / Math.sqrt(ds.length), dz: mean(ds) / sd(ds), same: share(rows, r => r.cls === 'same') };
}
function histSvg(S) {

  const W = 560, H = 170, pl = 30, pb = 26, mx = Math.max(...bins.map(b => b.n)), bw = (W - pl - 8) / bins.length;

    <line x1="${X(S.cut)}" x2="${X(S.cut)}" y1="6" y2="${H - pb}" stroke="var(--ink)" stroke-dasharray="4 3"/><text x="${X(S.cut) + 4}" y="16" font-size="11" fill="var(--ink)">기준 ${S.cut}점</text>

function localApi(path, body) {

  if (!K) return { status: 400, data: { error: '알림 종류가 올바르지 않습니다.' } };

  const rs = demoRoster().filter(r => users[r.no]).filter(r => {
    const h = lsGet(`store:u:${r.no}:hist`) || [];
    if (body.kind === 'diag_remind') return !h.length;
    if (body.kind === 'retest_open') return h.length && !h.some(x => x.end);

function axNow() {
  const S = settingsNow().ax || {};
  const a = JSON.parse(JSON.stringify(AX_DEFAULT));
  ['students', 'courses', 'advisors', 'meetings', 'items'].forEach(k => { if (S[k] != null) a[k] = S[k]; });
  Object.keys(a.tasks).forEach(k => { if (S.tasks && S.tasks[k]) a.tasks[k] = { ...a.tasks[k], ...S.tasks[k] }; });
  return a;
}
function axCalc(a) {
  const rows = AX_TASKS.map(([k, name, who, how0, how1, unit, units, per, minute]) => {
    const n = units(a) * per, f = minute ? 1 / 60 : 1, t = a.tasks[k];
    return { k, name, who, how0, how1, unit, n, before: t.before * n * f, after: t.after * n * f, ub: t.before, ua: t.after };
  });
  const before = rows.reduce((s, r) => s + r.before, 0), after = rows.reduce((s, r) => s + r.after, 0);
  return { rows, before, after, saved: before - after, pct: before ? (before - after) / before * 100 : 0 };
}

  { title: '③ 추천 교육과정', text: '차이를 메우는 교양·융합과정·비교과를 추천합니다. 비교과는 관심 등록만 하고 개설되면 알림을 받습니다. 모두 선택이며, 학생이 고른 것만 이수 계획에 들어갑니다.', sel: '.p-rlib', prep: async () => go('recs') },
  { title: '④ 이수 로드맵', text: "고른 교육과정이 학년·학기별 단계로 펼쳐집니다. 층(학과 편성 교양·추천 교양·융합과정·비교과)과 학기 학점, 재진단·디그리 달성 같은 이정표를 한눈에 보고, 고칠 때는 '계획 고치기'에서 끌어 옮깁니다. 아래 졸업 요건 점검은 교양 학점과 직업기초 학점을 기준과 비교합니다.", sel: '.p-pmap', prep: async () => { go('recs'); const la = document.getElementById('rliball'); if (la && /추천 모두/.test(la.textContent)) la.click(); document.getElementById('rbuild').click(); await new Promise(r => setTimeout(r, 300)); } },
  { title: '④ 이번 학기 시간표', text: '이번 학기 계획을 전공 시간표(학사정보시스템 또는 직접 입력)의 빈 시간에 맞춰 확정합니다. 계획한 과목을 먼저 넣고 남는 시간은 목적에 맞는 교양으로 채우며, 수업 사이에는 자기주도 학습을 제안합니다.', sel: '.tt', prep: async () => { go('timetable'); await new Promise(r => setTimeout(r, 50)); document.getElementById('ttdb').click(); await new Promise(r => setTimeout(r, 900)); document.getElementById('ttgo').click(); for (let i = 0; i < 60 && state.ttPend; i++) await new Promise(r => setTimeout(r, 250)); if (state.step === 'timetable') renderTimetable(); } },
  { title: '추천 이유 · 수준별 분반과 정원', text: "과목마다 추천 이유와 내 점수에 맞는 기초·표준·심화 분반, 잔여 석을 보여 줍니다. 권장 분반이 시간 겹침이나 정원 마감이면 다른 분반을 넣고 이유를 밝힙니다.", sel: '.p-ttr', prep: async () => { if (!document.querySelector('.p-ttr')) go('timetable'); const r = document.querySelector('.p-ttr'); if (r) r.scrollIntoView({ block: 'start' }); } },
  { title: '융합과정 현황', text: '수강 대상인 융합과정마다 나노·마이크로디그리 기준 대비 이수 완료, 수강 중, 계획 학점과 더 들어야 할 과목을 보여 줍니다. 이미 들은 과목이 다른 과정에 겹치면 그 진도에도 반영됩니다.', sel: '.mgrid', prep: async () => go('roadmap') },
  { title: '홈 · 이번 주 자기주도 학습', text: '시간표 추천이 제안한 학습을 주마다 표시하고 최근 4주 실천률을 봅니다. 2주 연속 50% 미만이면 지도교수 화면에 상담 권장으로 표시됩니다.', sel: '.p-hck', prep: async () => { go('home'); const d = document.getElementById('ckdemo'); if (d) d.click(); } },
  { title: '학기말 재진단과 성장', text: '학기말에는 같은 능력을 다른 문항(B형)으로 재진단해 같은 척도로 비교합니다. 변화 재생을 누르면 입학 직후부터 영역별 점수가 어떻게 바뀌었는지 레이더로 보여 줍니다.', sel: '.morph', prep: async () => { state.phase = 'end'; if (!(state.history || []).some(h => h.end)) { fillDemo(false, true); state.pendingSnap = false; snapshot(); } go('growth'); await new Promise(r => setTimeout(r, 300)); const p = document.getElementById('mplay'); if (p) p.click(); } },
  { title: '교원 홈 · 지금 할 일', text: '남은 상담, 후속 점검일, 학기 시점별 할 일이 모입니다. 아래 이용 학생 표에서는 진단 결과와 자기주도 실천률을 함께 봅니다. 수준별 분반은 진단 점수로 자동 편성됩니다.', sel: '.p-fw', prep: async () => { await tourLogin('faculty'); state.phase = 'mid'; go('fhome'); } },
  { title: '교원 · 상담 준비 카드', text: '향상도가 기준에 못 미치거나 낮은 수준이 이어지는 학생을 지도교수에게 알리고, 상담 질문과 연계할 과목까지 준비해 줍니다. 상담 후 합의한 행동과 후속 점검일을 기록합니다.', sel: '.prep', prep: async () => go('advisor') },
  { title: '관리자 홈 · 지금 할 일', text: '관리자 메뉴는 학기 흐름(학기 초 → 학기 중 → 학기말 → 교육과정 개선) 순서입니다. 홈에는 시점별로 할 일(안내 메일, 미연동 자료, 점검 필요 문항, 매핑 승인)이 모입니다.', sel: '.p-todo', prep: async () => { await tourLogin('admin'); state.phase = 'start'; go('ahome'); } },
  { title: '학기 초 · 전공 시간표', text: '학과마다 미리 편성된 전공 교과목 시간표를 학기별로 등록·수정·삭제합니다. 시간이 겹치면 표시하고, CSV로 한꺼번에 올릴 수도 있습니다. 학생 시간표 추천은 이 시간표의 빈 시간을 기준으로 합니다.', sel: '.p-mtlist', prep: async () => { go('majortt'); const d = document.getElementById('mtdemo'); if (d) d.click(); } },
  { title: '학기 중 · 비교과 개설과 수강 알림', text: '비교과는 해마다 개설 여부와 시기가 달라 학생 계획·시간표에 넣지 않습니다. 관리자가 연계 역량, 3-IN 단계, 신청·운영 기간, 정원, 대상을 넣어 개설을 등록하면, 관심 등록했거나 연계 역량이 부족한 학생의 홈에 신청 안내가 뜹니다. 해마다 반복되는 프로그램은 다음 해로 복사합니다.', sel: '.p-nclist', prep: async () => { go('ncopen'); const d = document.getElementById('ncdemo'); if (d) d.click(); } },
  { title: '학기 초 · 교양·융합 시간표', text: '교양과 융합과정 분반을 공통 또는 학과·학년·반 전용으로 배치합니다. 대상별 점검에서 그 반의 전공 시간표 위에 들을 수 있는 분반을 겹쳐 보고, 전공과 겹치는 분반을 찾아 고칩니다. 학생 추천은 자기에게 열린 분반만 씁니다.', sel: '.p-etck', prep: async () => go('electt') },
  { title: '학기 초 · 학사·수강편람 연동', text: '학사정보시스템 API를 연결하거나, 그 전에는 수강편람(분반·시간·정원)과 전공 시간표를 CSV로 올립니다. 올린 자료는 학생 시간표 추천에 바로 쓰입니다.', sel: '.intup', prep: async () => go('integration') },
  { title: '학기 초 · 문항 분석과 AI 고도화', text: "예비 시행 응답으로 난이도·변별도·신뢰도를 계산해 고칠 문항을 고릅니다. 'AI 고도화로'를 누르면 같은 능력을 재는 평행 문항 초안을 만들어 검토 후 학기말 B형에 넣습니다.", sel: '.p-qabad', prep: async () => go('itemqa') },
  { title: '학기말 · 교육과정 효과성', text: '교양·융합과정·비교과마다 입학 직후 점수를 맞춘 보정 효과를 구하고 유지·확대·개선·재설계 판단을 붙입니다. 역량 향상도와 AI 데이터 비서도 같은 화면에서 봅니다.', sel: '.p-escat', prep: async () => { state.phase = 'end'; go('impact'); } },
  { title: '교육과정 개선 · 역량 매핑', text: '교과목 명세서를 읽어 AI가 과목이 기르는 능력을 근거 문장과 함께 고르고, 위원회가 승인하면 학생 추천에 반영됩니다.', sel: '.p-smed', prep: async () => go('specmap') },
  { title: '교육과정 개선 · 위원회 보고서', text: '진단, 향상도, 효과성, 매핑 결과를 위원회 보고서로 정리해 PDF·Word로 내려받습니다. 투어를 마치면 이 계정으로 직접 둘러볼 수 있습니다.', sel: '.p-rdoc', prep: async () => go('report') }

async function tourLogout() { await authCall('/api/auth/logout', {}); STORE.user = {}; STORE.org = {}; state.user = null; resetDiag(); useForm('A'); state.history = []; state.seen = {}; state.plan = null; state.chat = []; state.tt = null; state.step = 'login'; render(); }
async function tourLogin(role, no) {
  if (!role) { await tourLogout(); return; }
  if (state.user) { await authCall('/api/auth/logout', {}); STORE.user = {}; STORE.org = {}; state.user = null; resetDiag(); useForm('A'); state.history = []; state.seen = {}; state.plan = null; state.chat = []; }
  const r = await authCall(role === 'student' ? '/api/auth/student-demo' : '/api/auth/staff-demo', role === 'student' ? { no } : { role });
  if (r.status !== 200) throw new Error(r.data.error || '로그인 실패');
  await enterUser(r.data.user);
}
function tourMark(sel) {
  document.querySelectorAll('.tour-hl').forEach(e => e.classList.remove('tour-hl'));
  const el = sel && [...document.querySelectorAll(sel)].find(e => e.offsetParent !== null);
  if (el) { el.classList.add('tour-hl'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}
async function tourShow(i) {
  const T = state.tour; if (!T) return;
  T.i = Math.max(0, Math.min(TOUR.length - 1, i));
  const s = TOUR[T.i];
  const box = document.getElementById('tourbox') || document.body.appendChild(Object.assign(document.createElement('aside'), { id: 'tourbox', className: 'tour no-print' }));
  box.setAttribute('aria-live', 'polite');
  box.innerHTML = `<p class="tour-n">${T.i + 1} / ${TOUR.length}</p><h2>${s.title}</h2><p class="meta">준비 중…</p>`;
  try {
    const seen = T.done[T.i];
    if (seen) {
      /* 이미 본 단계로 돌아가면: 그때의 역할로 다시 들어가(필요하면) 그때 화면·시점으로 이동 */
      const curRole = state.user ? state.user.role : null;
      if (seen.role !== curRole) { if (seen.role) await tourLogin(seen.role, '20261001'); else await tourLogout(); }
      state.phase = seen.phase;
      if (seen.role) go(seen.step);
    } else if (s.prep) await s.prep();
    T.done[T.i] = { step: state.user ? state.step : 'login', role: state.user ? state.user.role : null, phase: state.phase };
  } catch (e) { box.innerHTML = `<h2>투어를 계속할 수 없습니다</h2><p class="meta">${esc(e.message)}</p><div class="actions"><button class="btn sm" id="tend">끝내기</button></div>`; document.getElementById('tend').onclick = tourEnd; return; }
  await new Promise(r => setTimeout(r, 450));
  tourMark(s.sel);
  box.innerHTML = `<p class="tour-n">${T.i + 1} / ${TOUR.length} <span class="tour-bar"><i style="width:${(T.i + 1) / TOUR.length * 100}%"></i></span></p><h2>${s.title}</h2><p>${s.text}</p>
    <div class="actions"><button class="btn ghost sm" id="tprev" ${T.i ? '' : 'disabled'}>이전</button><button class="btn sm" id="tnext">${T.i === TOUR.length - 1 ? '직접 둘러보기' : '다음'}</button><button class="linkbtn" id="tend">끝내기</button></div>`;
  document.getElementById('tprev').onclick = () => tourShow(T.i - 1);
  document.getElementById('tnext').onclick = () => (T.i === TOUR.length - 1 ? tourEnd() : tourShow(T.i + 1));
  document.getElementById('tend').onclick = tourEnd;
  document.getElementById('tnext').focus();
}
function tourStart() { state.tour = { i: 0, done: {} }; tourShow(0); }
function tourEnd() {
  state.tour = null;
  document.querySelectorAll('.tour-hl').forEach(e => e.classList.remove('tour-hl'));
  const b = document.getElementById('tourbox'); if (b) b.remove();
}
document.addEventListener('keydown', e => { if (state.tour && e.key === 'Escape') tourEnd(); });

   - 지금 과목–역량 연결은 과목명 기준 초안. 명세서(개요·학습목표·주요 내용)를 근거로 다시 매핑합니다.

function specRule(spec) {
  const sents = [...String(spec.overview || '').split(/(?<=[.다])\s+/), ...(spec.goals || []), ...String(spec.weeks || '').split('·')].map(x => x.trim()).filter(Boolean);
  const out = [];
  Object.entries(SPEC_KW).forEach(([sub, re]) => {
    const hit = sents.filter(t => re.test(t));
    if (!hit.length) return;
    const inGoal = (spec.goals || []).some(g => re.test(g));
    out.push({ sub, role: hit.length >= 2 || inGoal ? '주' : '부', evidence: hit[0], n: hit.length });
  });
  return out.sort((a, b) => (a.role === b.role ? b.n - a.n : a.role === '주' ? -1 : 1)).slice(0, 6);
}

function applyMapping() {

  Object.entries(CURRICULUM.byDept).forEach(([d, cs]) => cs.forEach(c => {

    const next = M[c.n] ? M[c.n].subs.slice() : c._subs0.slice();
    if (next.join() !== c.subs.join()) { c.subs = next; changed++; }

const ASK_EXAMPLES = ['기계공학과에서 디지털 역량이 떨어진 학생은 몇 명이야?', '학과별 직업기초역량 향상도를 보여줘', '재실시 판정을 받은 학생은 계열별로 몇 명이야?', '융합과정을 이수한 학생과 안 한 학생의 향상도 차이는?', '입학 직후 수리 점수가 40점 미만인 학생은 몇 명이야?', '핵심역량 사회인 점수가 가장 낮은 학과 5곳은?'];

function pilotResponses() {
  /* 가상 예비 시행(300명). 실제로는 응답 파일을 올려 교체. 일부 문항은 품질 문제를 일부러 넣어 판정 예시를 보여 줌 */

  const items = [
    ...ITEMS_A.map((it, k) => ({ key: 'ncs:' + k, diag: 'ncs', name: it.s, t: it.t, max: it.t === 'self' ? 5 : it.t === 'sjt' ? 4 : 1 })),

function itemStats(P) {

   학사 연동(수강편람·전공 시간표), 졸업 요건 점검, 자기주도 학습 실천 점검
   ====================================================================== */
/* 수강편람·전공 시간표: 관리자가 파일로 올리거나(API 연동 전) 학사 API에서 받은 자료. 없으면 시연용 값을 씁니다 */
const catalogNow = () => sGet('org', 'catalog') || null;
const LV_OF = { 기초반: '하', 표준반: '중', 심화반: '상', 기초: '하', 표준: '중', 심화: '상', 하: '하', 중: '중', 상: '상' };
const DAY_OF = { 월: 0, 화: 1, 수: 2, 목: 3, 금: 4 };
const seatsLeft = s => Math.max(0, (s.cap || 40) - (s.enr || 0));
function catalogParse(kind, rows) {
  /* rows: CSV 2차원 배열(머리글 포함). 잘못된 줄은 사유와 함께 돌려줍니다 */
  const out = {}, bad = [], hdr = (rows[0] || []).map(x => String(x || ''));
  rows.slice(1).forEach((r, i) => {
    const c = r.map(x => String(x || '').trim()); if (!c.some(Boolean)) return;
    const line = i + 2;
    if (kind === 'courses') {
      const ix = re => hdr.findIndex(x => re.test(x)), col = (re, def) => { const k = ix(re); return k >= 0 ? c[k] : def; };
      const named = ix(/요일/) >= 0;
      const [n, sec, lv, d, s, len, cap, enr] = named ? [col(/교과목|과목/), col(/분반/), col(/수준/), col(/요일/), col(/시작/), col(/^시간$|시수/), col(/정원/), col(/신청/)] : c;
      if (!n || !(d in DAY_OF) || !(+s >= 1 && +s <= EVE_P) || !(+len >= 1 && +s + +len - 1 <= EVE_P)) { bad.push(`${line}행: 교과목·요일·교시를 확인하세요`); return; }
      const sem = String(col(/학기/, '') || '').replace(/학기/, '').trim(), scope = /학과/.test(col(/대상/, '') || '') ? '학과' : '공통';
      (out[n] = out[n] || []).push({ sec: sec || String((out[n] || []).length + 1).padStart(2, '0'), lv: lv ? LV_OF[lv] || '' : '', d: DAY_OF[d], s: +s, len: +len, cap: +cap || 40, enr: +enr || 0, sem: sem === '1' || sem === '2' ? sem : '', scope, dept: scope === '학과' ? col(/^학과$/, '') || '' : '', grade: scope === '학과' ? String(col(/학년/, '') || '').replace(/학년/, '') : '', ban: scope === '학과' ? String(col(/^반$/, '') || '').replace(/반/, '').toUpperCase() : '' });
    } else {
      const hasBan = hdr.some(x => /반/.test(x) && !/학기/.test(x));
      const [dept, term, ban, n, d, s, len] = hasBan ? c : [c[0], c[1], '', c[2], c[3], c[4], c[5]];
      const key = banKey(term, String(ban || '').replace(/반$/, '').trim().toUpperCase());
      if (!dept || !/^\d-[12]$/.test(term) || !n || !(d in DAY_OF) || !(+s >= 1) || !(+len >= 1 && +s + +len - 1 <= EVE_P)) { bad.push(`${line}행: 학과·학기(예: 1-1)·과목·요일·교시를 확인하세요`); return; }
      ((out[dept] = out[dept] || {})[key] = out[dept][key] || []).push({ n, d: DAY_OF[d], s: +s, len: +len });
    }
  });
  return { data: out, bad };
}
function catalogTemplate(kind) {

function gradCheck(plan) {

  const lib = items.filter(i => ['base', 'rec', 'added'].includes(i.kind)).reduce((a, i) => a + (i.cr || 0), 0); /* 융합과정은 선택 과정이라 교양 학점과 따로 셈 */

    { k: '직업기초 영역 학점', now: basic, need: G.basicMin, unit: '학점', go: 'plan', fix: "과목 더하기에서 '직업기초' 과목 넣기" },
    ...(G.ncPerIn > 0 ? [1, 2, 3].map(k => ({ k: `비교과 ${k}-IN(${IN_AXIS[k]})`, now: nc[k - 1], need: G.ncPerIn, unit: '회', go: 'plan', fix: `${k}-IN 비교과 넣기` })) : [])
  ];
  if (tier) rows.push({ k: `${mp.name} ${tier[1]}`, now: mcr, need: tier[0], unit: '학점', go: 'roadmap', fix: '융합과정 구성 과목 배치', opt: true });
  if (!(G.ncPerIn > 0)) rows.push({ k: '비교과(관심 등록)', now: nc[0] + nc[1] + nc[2], need: 0, unit: '개', opt: true, ncOpt: true });
  return rows.map(r => ({ ...r, ok: r.now >= r.need }));
}
function gradHtml(plan) {

/* ---------- 자기주도 학습 실천 점검(주간): 시간표의 '빈 시간 활용 제안'을 실제로 했는지 학생이 표시 ---------- */
function isoWeek(dt) {
  const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate())), day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return `${d.getUTCFullYear()}-W${String(Math.ceil(((d - y0) / 864e5 + 1) / 7)).padStart(2, '0')}`;
}
const weekBack = n => isoWeek(new Date(Date.now() - n * 7 * 864e5));
const studyKey = b => `${b.d}-${b.s}-${b.n}`;
function ttStat(tt) {
  const W = [3, 2, 1, 0].map(weekBack), C = tt.checks || {};
  const weeks = W.map(w => ({ w, done: (C[w] && C[w].done || []).length, total: C[w] ? C[w].total : 0 }));
  const has = weeks.filter(x => x.total);
  const rate = has.length ? Math.round(has.reduce((a, x) => a + x.done, 0) / has.reduce((a, x) => a + x.total, 0) * 100) : null;
  let low = 0; for (let i = has.length - 1; i >= 0 && has[i].done / has[i].total < .5; i--) low++;
  return { rate, weeks, lowStreak: low, at: new Date().toISOString().slice(0, 10) };
}
function checkinHtml() {

  const res = tt.res || (tt.res = ttRecommend(tt, tt.ai && tt.ai.picks)), wk = weekBack(0), cur = (tt.checks || {})[wk] || { done: [], total: res.study.length };

    <p class="meta">${st.rate === null ? '이번 주부터 표시해 보세요.' : `최근 4주 실천률 ${st.rate}%`}${st.lowStreak >= 2 ? ' · 2주 연속 50% 미만이라 지도교수 상담 화면에 표시됩니다.' : ''}</p>
    ${demoOn() ? '<button class="linkbtn demo-note" id="ckdemo" type="button">시연: 지난 3주 기록 채우기</button>' : ''}`;
}

  if (p === 'mid' && !state.gradeApplied) out.push({ t: '학점 연계 자료 반영', d: '비교과·교양 이수 결과를 업로드해 학점과 이수 기록에 반영합니다.', due: '반영 대기', go: 'grades', lv: 'high' });

}

   - 추천 교양·융합과정·비교과는 모두 선택. ③에서 학생이 고른 것만 ④ 계획에 들어갑니다(학과 편성 교양은 자동).

const curTerm = () => planTerms(state.dept)[0];            /* 이번 학기(시연: 신입생 1학년 1학기) */

function designTarget() {
  /* 목표: 직무가 있으면 그 직무의 필요 역량, 없으면 진단에서 '높음' 미만인 하위능력을 높음 기준까지 */

  const core = job ? job.core : Object.fromEntries(dd.subs.filter(x => x.v < HIGH).sort((a, b) => a.v - b.v).slice(0, 6).map(x => [x.s, HIGH]));
  const gaps = Object.entries(core).map(([sn, t]) => ({ sn, t, v: now[sn] ?? 0, gap: Math.max(0, t - (now[sn] ?? 0)) })).sort((a, b) => b.gap - a.gap);
  return { job, now, core, gaps, mode: job ? 'job' : 'undecided', label: job ? job.name : '진단 기반 보완(직무 미정)' };

/* ② 차이 분석: 규칙으로 차이를 계산하고 AI가 우선순위와 이유를 설명 */
function gapData(T) {
  return { kind_note: '목표 대비 역량 차이 분석', target: T.label, target_job: T.job ? { name: T.job.name, ncs: T.job.ncs } : null,

function gapRule(T) {
  const top = T.gaps.filter(g => g.gap > 0).slice(0, 3);
  return { summary: top.length ? `${T.label} 기준으로 ${top.map(g => `${g.sn}(${g.v}→${g.t})`).join(', ')} 순으로 차이가 큽니다. 차이가 큰 능력부터 교양으로 기초를 다지고, 필요하면 융합과정과 비교과로 실전 경험을 더하세요.` : `${T.label}에 필요한 역량을 이미 대부분 갖추고 있습니다. 강점을 살리는 과목과 융합과정을 살펴보세요.`,
    strengths: T.gaps.filter(g => g.gap === 0).slice(0, 3).map(g => `${g.sn} ${g.v}점으로 목표(${g.t})를 넘었습니다.`),
    cautions: top.map(g => `${g.sn}: 지금 ${g.v}점, 목표까지 ${g.gap}점`), actions: top.map(g => `${g.sn}을(를) 다루는 교양을 이번 학기나 다음 학기에 수강`) };
